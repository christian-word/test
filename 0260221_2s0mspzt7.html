<body>
<div class="upload-section">
<p>Оберіть XML-файл у форматі 1819.XML:</p>
<input type="file" id="fileInput" accept=".xml,.txt">
</div>
<div class="controls">
<button onclick="printDocument()">🖨️ Друк (2 екземпляри на 1 аркуш)</button>
<button onclick="clearDocument()">🧹 Очистити</button>
</div>
<div id="documentsContainer" class="documents-container"></div>
<script>
document.getElementById('fileInput').addEventListener('change', function(e) {
const file = e.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = function(e) {
try {
processXML(e.target.result);
} catch (error) {
alert('Помилка: ' + error.message);
console.error(error);
}
};
reader.readAsText(file, 'windows-1251');
});
function processXML(xmlText) {
const parser = new DOMParser();
const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
const data = extractData(xmlDoc);
renderTwoDocuments(data);
document.getElementById('documentsContainer').style.display = 'block';
}
function extractData(xmlDoc) {
const get = (tag) => {
const el = xmlDoc.getElementsByTagName(tag)[0];
return el ? el.textContent.trim() : '';
};
const getWithRowNum = (tag, rowNum) => {
const elements = xmlDoc.getElementsByTagName(tag);
for (let i = 0; i < elements.length; i++) {
const rownum = elements[i].getAttribute('ROWNUM');
if (rownum === rowNum) {
return elements[i].textContent.trim();
}
}
return '';
};
function formatDate(dateStr) {
if (!dateStr || dateStr.length !== 8) return dateStr;
return dateStr.substring(0,2) + '.' +
dateStr.substring(2,4) + '.' +
dateStr.substring(4,8);
}
function formatDateTime(dateTag, hourTag, minuteTag) {
const date = formatDate(get(dateTag));
const hour = get(hourTag);
const minute = get(minuteTag);
if (date || hour || minute) {
let result = '';
if (date) result += date + ' ';
if (hour) result += 'о ' + hour + '-год';
if (minute) {
if (hour) result += ' : ';
result += minute + '-ХВ';
}
return result.trim();
}
return '';
}
return {
date: formatDate(get('D_FILL')),
number: get('HNUM'),
ksti: get('HKSTI'),
sti: get('HSTI'),
csoName: get('HNAME'),
csoTin: get('HTIN'),
contractNum: get('R0101G1S'),
contractDate: formatDate(get('R0102G1D')),
contractEndDate: formatDate(get('R0104G1D')),
fiscalNum: get('R0105G1S'),
modelCode: get('R0106G1'),
modelName: get('R0106G1S'),
serialNum: get('R0107G1S'),
softwareCode: get('R0108G1'),
softwareVer: get('R0108G1S'),
manufacturer: get('R0111G1S'),
manufactureDate: formatDate(get('R0112G1D')),
operationDate: formatDate(get('R0113G1D')),
unsealDate: formatDate(get('R0114G1D')),
unsealHour: get('R0114G2') || '',
unsealMinute: get('R0114G3') || '',
unsealReason: get('R0115G1S'),
entityName: get('R0118G1S'),
entityTin: get('R0119G1S'),
unitName: get('R0120G1S'),
unitAddress: get('R0121G1S'),
territoryCode: get('R0122G1S'),
responsiblePerson: get('HBOS'),
csoPosition: get('R0203G1S'),
csoPerson: get('R0203G2S'),
personalizationDateTime: formatDateTime('R0201G1D', 'R0201G2', 'R0201G3'),
sealingDateTime: formatDateTime('R0202G1D', 'R0202G2', 'R0202G3'),
controlMeansNumbers: getWithRowNum('T1RXXXXG1S', '1'),
modemModel: get('R0109G1S'),
modemSerial: get('R0110G1S')
};
}
function renderDocumentHTML(data, isSecond = false) {
return `
<div class="document-half ${isSecond ? 'last-document' : ''}">
<div class="form-header">

<div class="form-title-small">F13I6105</div>

</div>

ФОРМА № 1-ЦСО

</div>
</div>
<!-- 4 колонки для шахматного порядку -->
<table class="main-table">

</tr>

</tr>
<tr>

</tr>
<tr>
<td class="label">номер договору з ЦСО</td>

<td class="value"><strong>${data.contractDate}</strong></td>
</tr>
<tr>

</tr>
<!-- ОБ'ЄДНАНО: Модель і заводський номер в одному рядку -->
<tr>

</tr>

<tr>

<td class="label" style="font-size:5.5pt;">виробник (постачальник)</td>
<td class="value" style="font-size:7.5pt;"><strong>${data.manufacturer}</strong></td>
</tr>
<!-- ОБ'ЄДНАНО: Модем і дати в одному рядку -->
<tr>
<td class="label" style="font-size:5pt;">модель модема **</td>
<td class="value" style="font-size:7pt;"><strong>${data.modemModel}</strong></td>
<td class="label">дата виготовлення</td>
<td class="value"><strong>${data.manufactureDate}</strong></td>
</tr>
<tr>
<td class="label" style="font-size:5pt;">зав. номер модема **</td>
<td class="value" style="font-size:7pt;"><strong>${data.modemSerial}</strong></td>
<td class="label">дата введення в експлуатацію</td>
<td class="value"><strong>${data.operationDate}</strong></td>
</tr>
<tr>
<td colspan="4" class="section">Дата здійснення розпломбування <strong>${data.unsealDate}</strong> О <strong>${data.unsealHour}</strong> год <strong>${data.unsealMinute}</strong> ХВ</td>
</tr>
<tr>
<td class="label" colspan="2">Причина розпломбування</td>
<td class="value" colspan="2"><strong>${data.unsealReason}</strong></td>
</tr>
<tr>
<td class="label" colspan="2">характер виявленої несправності РРО</td>
<td class="value" colspan="2">-</td>
</tr>
<tr>
<td class="label" colspan="2">сума денної виручки на момент розпломбування</td>
<td class="value" colspan="2">-</td>
</tr>
</table>
<div class="usage-row">
<strong>РРО використовується (дані щодо суб'єкта господарювання): ${data.responsiblePerson}</strong>
</div>
<!-- 4 колонки для шахматного порядку -->
<table class="main-table">
<colgroup>
<col style="width: 20%;">
<col style="width: 30%;">
<col style="width: 20%;">
<col style="width: 30%;">
</colgroup>
<tr>
<td colspan="4" class="section">в господарській одиниці (дані щодо господарської одиниці):</td>
</tr>
<tr>
<td class="label" colspan="2">1<br>податковий номер / серія та номер паспорта</td>
<td class="label">код території</td>
<td class="value"><strong>${data.territoryCode}</strong></td>
</tr>
<tr>
<td class="label" colspan="2">1<br>податковий номер (значення)</td>
<td class="value" colspan="2"><strong>${data.entityTin}</strong></td>
</tr>
<tr>

</tr>
<tr>

<td class="value" colspan="2"><strong>${data.unitAddress}</strong></td>
</tr>
</table>
<div class="signature-block">
<div><strong>Відповідальна особа суб'єкта господарювання :</strong></div>
<div style="display: flex; margin-top: 0.3mm;">
<div style="flex: 2;">

</div>

</div>
</div>
</div>

<strong>Конструкція та програмне забезпечення РРО відповідають документації виробника. РРО працює у фіскальному режимі роботи</strong>
</div>
<!-- 4 колонки: персоналізація і опломбування в одному рядку -->
<table class="bottom-table">

</colgroup>

</tr>

</tr>
</table>
<div class="signature-block">
<div><strong>Відповідальна особа ЦСО</strong></div>
<div style="display: flex; margin-top: 0.3mm;">
<div style="flex: 1;">
<div class="signature-line"><strong>${data.csoPosition}</strong></div>
<div class="signature-label">(посада)</div>
</div>
<div style="flex: 1;">
<div class="signature-line"><strong>${data.csoPerson}</strong></div>
<div class="signature-label">(прізвище та ініціали) (підпис)</div>
</div>
</div>
</div>
<div class="rejection-section">
<div class="rejection-title">Відмовлено в опломбуванні РРО</div>
<table class="bottom-table">
<colgroup>
<col style="width: 50%;">
<col style="width: 50%;">
</colgroup>
<tr>

</tr>

<td class="value">-</td>

<div class="signature-block" style="margin-top: 0.2mm;">

</div>
<div style="flex: 1; font-size: 5pt;">
<div class="signature-line"></div>
<div class="signature-label">(прізвище та ініціали) (підпис)</div>
</div>
</div>
</div>
</div>
<div class="footnotes">
<div>1 Серія та номер паспорта / номер ID картки (для фізичних осіб, які через свої релігійні переконання відмовились від прийняття реєстраційного номера облікової картки платника податків та офіційно повідомили про це відповідний контролюючий орган і мають відповідну відмітку в паспорті).</div>
<div>2 Графа заповнюється в разі наявності у РРО зовнішнього модема.</div>
</div>
</div>
`;
}
function renderTwoDocuments(data) {
const container = document.getElementById('documentsContainer');
container.innerHTML = renderDocumentHTML(data, false) + renderDocumentHTML(data, true);
}
function printDocument() {
window.print();
}
function clearDocument() {
document.getElementById('documentsContainer').style.display = 'none';
document.getElementById('documentsContainer').innerHTML = '';
document.getElementById('fileInput').value = '';
}
</script>
</body>
</html>
