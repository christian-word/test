<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My YouTube Studio - Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #0f0f0f; 
            --bg-secondary: #181818;
            --panel: #212121; 
            --panel-hover: #2a2a2a;
            --accent: #ff0000; 
            --accent-hover: #cc0000;
            --text: #f1f1f1; 
            --text-secondary: #aaaaaa;
            --border: #3a3a3a;
            --success: #10b981;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Roboto', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            overflow-x: hidden;
        }
        
        /* Header */
        header { 
            background: var(--bg-secondary); 
            padding: 12px 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        
        .logo { 
            color: var(--accent); 
            font-weight: bold; 
            font-size: 22px; 
            letter-spacing: 1px; 
        }
        
        .user-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--border);
            transition: all 0.2s;
        }
        
        .user-avatar:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }
        
        .signin-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .signin-btn:hover {
            background: var(--accent-hover);
        }
        
        /* Sync Status */
        .sync-badge {
            padding: 6px 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .sync-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            animation: blink 2s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .sync-dot.syncing {
            background: #3b82f6;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Main Container */
        .container { 
            padding: 20px; 
            max-width: 1400px; 
            margin: 0 auto; 
            display: grid; 
            grid-template-columns: 1fr 380px; 
            gap: 20px; 
            min-height: calc(100vh - 80px);
        }
        
        @media (max-width: 900px) { 
            .container { 
                grid-template-columns: 1fr; 
                min-height: auto; 
            } 
        }

        /* Main Content Area */
        .main-content { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        
        .search-area { 
            background: var(--panel); 
            padding: 16px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
        }
        
        .search-box { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 12px;
        }
        
        .input-field { 
            flex: 1; 
            padding: 12px 16px; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            background: var(--bg-secondary); 
            color: var(--text); 
            outline: none; 
            font-size: 0.95rem;
        }
        
        .input-field:focus {
            border-color: var(--accent);
        }
        
        .action-btn { 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 500; 
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        .action-btn:hover {
            background: var(--accent-hover);
        }
        
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .tabs {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid var(--border);
        }
        
        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        
        .tab-btn:hover {
            color: var(--text);
        }
        
        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* Search Results */
        #search-results-container { 
            background: var(--bg-secondary); 
            border-radius: 12px; 
            border: 1px solid var(--border);
            padding: 20px;
            display: none;
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .search-item-row { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 15px; 
            background: var(--panel); 
            padding: 12px; 
            border-radius: 8px; 
            align-items: center;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        
        .search-item-row:hover {
            border-color: var(--accent);
            background: var(--panel-hover);
        }
        
        .search-item-row img { 
            width: 140px; 
            border-radius: 6px; 
            cursor: pointer; 
        }
        
        .search-item-info { 
            flex: 1; 
        }
        
        .search-title {
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 6px;
            cursor: pointer;
            line-height: 1.3;
        }
        
        .search-title:hover {
            color: var(--accent);
        }
        
        .search-channel {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        
        .add-btn { 
            background: var(--success); 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 0.85rem; 
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .add-btn:hover {
            background: #059669;
        }
        
        .add-btn.added {
            background: #6b7280;
            cursor: default;
        }

        /* Welcome Screen */
        #welcome-screen { 
            text-align: center; 
            padding: 100px 20px;
            color: var(--text-secondary);
        }
        
        #welcome-screen h2 {
            color: var(--text);
            margin-bottom: 10px;
            font-size: 2rem;
        }
        
        #welcome-screen p {
            font-size: 1.1rem;
        }

        /* Playlist Sidebar */
        .sidebar { 
            background: var(--panel); 
            border-radius: 12px; 
            padding: 16px; 
            border: 1px solid var(--border); 
            overflow-y: auto; 
            max-height: calc(100vh - 120px);
        }
        
        .sidebar h4 {
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .playlist-count {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 400;
        }
        
        .group-section {
            margin-bottom: 20px;
        }
        
        .group-header {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
        }
        
        .video-item { 
            display: flex; 
            gap: 10px; 
            padding: 10px; 
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        
        .video-item:hover { 
            background: var(--panel-hover);
            border-color: var(--border);
        }
        
        .video-item.dragging {
            opacity: 0.5;
        }
        
        .video-item img { 
            width: 100px; 
            border-radius: 6px; 
            flex-shrink: 0;
        }
        
        .video-item-info { 
            flex: 1; 
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .video-title-small {
            font-weight: 500;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .video-meta-small {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        .delete-icon { 
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .delete-icon:hover {
            color: var(--accent);
            transform: scale(1.2);
        }

        /* Player Overlay */
        #player-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.95); 
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        
        .close-player {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 50px;
            color: var(--text);
            cursor: pointer;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        .close-player:hover {
            background: var(--panel);
            color: var(--accent);
        }
        
        .player-container {
            width: 90%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .player-box {
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .player-info {
            background: var(--panel);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        .player-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .player-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel);
            padding: 16px 24px;
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            z-index: 3000;
            transition: bottom 0.3s;
            font-size: 0.95rem;
        }
        
        .toast.show {
            bottom: 30px;
        }
        
        /* Loading */
        .loading {
            border: 2px solid rgba(255,255,255,0.2);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 0.6s linear infinite;
            display: inline-block;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        
        .empty-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.3;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">📺 MY YOUTUBE STUDIO</div>
        <div class="user-section">
            <div class="sync-badge" id="syncBadge" style="display: none;">
                <div class="sync-dot" id="syncDot"></div>
                <span id="syncText">Синхронизировано</span>
            </div>
            <div id="auth-box"></div>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <div class="search-area">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('add')">➕ Добавить</button>
                    <button class="tab-btn" onclick="switchTab('search')">🔍 Поиск YouTube</button>
                </div>
                
                <div style="margin-top: 12px;">
                    <div id="add-tab">
                        <div class="search-box">
                            <input type="text" id="main-input" class="input-field" placeholder="Вставьте ссылку на YouTube видео или плейлист...">
                            <button onclick="handleAdd()" class="action-btn" id="addBtn">Добавить</button>
                        </div>
                    </div>
                    
                    <div id="search-tab" style="display: none;">
                        <div class="search-box">
                            <input type="text" id="search-input" class="input-field" placeholder="Введите запрос для поиска на YouTube...">
                            <button onclick="searchYouTube()" class="action-btn" id="searchBtn">
                                <span id="searchBtnText">Искать</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="search-results-container">
                <h4 style="margin-bottom: 16px; color: var(--text-secondary);">Результаты поиска:</h4>
                <div id="results-list"></div>
            </div>

            <div id="welcome-screen">
                <h2>Добро пожаловать в Cloud Studio</h2>
                <p>Ваш личный архив видео в облаке ☁️</p>
            </div>
        </div>

        <div class="sidebar">
            <h4>
                Мой плейлист
                <span class="playlist-count" id="playlistCount">0 видео</span>
            </h4>
            <div id="playlist-container">
                <div class="empty-state">
                    <div class="empty-icon">📺</div>
                    <p>Плейлист пуст</p>
                </div>
            </div>
        </div>
    </div>

    <div id="player-overlay" onclick="if(event.target === this) closePlayer()">
        <span class="close-player" onclick="closePlayer()">&times;</span>
        <div class="player-container">
            <div class="player-box" id="player-box"></div>
            <div class="player-info" id="player-info" style="display: none;">
                <div class="player-title" id="player-title"></div>
                <div class="player-description" id="player-description"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCStotpGP7KhN2teP9S2pV42-lJNdO_L7U",
            authDomain: "myplaulistplauer.firebaseapp.com",
            projectId: "myplaulistplauer",
            databaseURL: "https://myplaulistplauer-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        // YouTube API Key (separate from Firebase API key)
        const YOUTUBE_API_KEY = 'AIzaSyB79LenCkfDqTFbrVMRVoAqRp5Wpzy_2Dg';

        let playlist = [];
        let searchResults = [];
        let currentUser = null;

        // Auth State
        onAuthStateChanged(auth, (user) => {
            const authBox = document.getElementById('auth-box');
            const syncBadge = document.getElementById('syncBadge');
            
            if (user) {
                currentUser = user;
                authBox.innerHTML = `<img src="${user.photoURL}" onclick="logoutUser()" class="user-avatar" title="Нажмите для выхода">`;
                syncBadge.style.display = 'flex';
                
                // Load playlist from Firebase
                onValue(ref(db, 'playlists/' + user.uid), (snap) => {
                    const data = snap.val();
                    playlist = data?.videos || [];
                    renderPlaylist();
                    updateSync('success');
                });
            } else {
                currentUser = null;
                authBox.innerHTML = `<button onclick="loginUser()" class="signin-btn">Войти через Google</button>`;
                syncBadge.style.display = 'none';
                playlist = [];
                renderPlaylist();
            }
        });

        // Login/Logout
        window.loginUser = async () => {
            try {
                await signInWithPopup(auth, provider);
                showToast('✅ Вход выполнен');
            } catch (error) {
                console.error(error);
                showToast('❌ Ошибка входа');
            }
        };

        window.logoutUser = async () => {
            if (confirm('Выйти из аккаунта?')) {
                await signOut(auth);
                showToast('👋 Вы вышли');
            }
        };

        // Save to Firebase
        async function savePlaylist() {
            if (!currentUser) return;
            
            updateSync('syncing');
            try {
                await set(ref(db, 'playlists/' + currentUser.uid), {
                    videos: playlist,
                    userName: currentUser.displayName,
                    lastUpdated: new Date().toISOString()
                });
                updateSync('success');
            } catch (error) {
                console.error(error);
                showToast('❌ Ошибка сохранения');
            }
        }

        // Update sync indicator
        function updateSync(status) {
            const dot = document.getElementById('syncDot');
            const text = document.getElementById('syncText');
            
            if (status === 'syncing') {
                dot.className = 'sync-dot syncing';
                text.textContent = 'Синхронизация...';
            } else if (status === 'success') {
                dot.className = 'sync-dot';
                text.textContent = 'Синхронизировано';
            }
        }

        // Add video or playlist
        window.handleAdd = async () => {
            const input = document.getElementById('main-input');
            const url = input.value.trim();
            
            if (!url) {
                showToast('❌ Вставьте ссылку');
                return;
            }
            
            if (!currentUser) {
                showToast('⚠️ Сначала войдите в аккаунт');
                return;
            }
            
            const playlistId = extractPlaylistId(url);
            const videoId = extractVideoId(url);
            
            if (playlistId) {
                await loadPlaylistFromYouTube(playlistId);
            } else if (videoId) {
                await addSingleVideo(videoId);
            } else {
                showToast('❌ Неверная ссылка YouTube');
            }
            
            input.value = '';
        };

        // Add single video (using NoEmbed - no API key needed!)
        async function addSingleVideo(videoId) {
            if (playlist.some(v => v.id === videoId)) {
                showToast('⚠️ Видео уже в плейлисте');
                return;
            }
            
            updateSync('syncing');
            const btn = document.getElementById('addBtn');
            btn.disabled = true;
            btn.textContent = 'Загрузка...';
            
            try {
                // Try NoEmbed first (no API key needed)
                const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                const data = await res.json();
                
                if (data.error) {
                    throw new Error('Видео не найдено');
                }
                
                const newVideo = {
                    id: videoId,
                    title: data.title || 'YouTube Video',
                    thumb: `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`,
                    description: '',
                    channel: data.author_name || 'YouTube',
                    date: new Date().toLocaleDateString('ru-RU'),
                    group: 'Одиночные видео'
                };
                
                playlist.unshift(newVideo);
                await savePlaylist();
                showToast('✅ Видео добавлено');
                
            } catch (error) {
                console.error(error);
                showToast('❌ Ошибка: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Добавить';
            }
        }

        // Load YouTube playlist (simplified - extract IDs and load via NoEmbed)
        async function loadPlaylistFromYouTube(playlistId) {
            updateSync('syncing');
            const btn = document.getElementById('addBtn');
            btn.disabled = true;
            btn.textContent = 'Загрузка плейлиста...';
            
            try {
                // Try to get playlist info via YouTube API
                const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${playlistId}&maxResults=50&key=${YOUTUBE_API_KEY}`);
                const data = await res.json();
                
                if (data.error) {
                    // If API fails, show manual instruction
                    showToast('⚠️ YouTube API недоступен. Добавляйте видео по одному.');
                    return;
                }
                
                if (!data.items || data.items.length === 0) {
                    showToast('⚠️ Плейлист пуст');
                    return;
                }
                
                const playlistTitle = data.items[0].snippet.channelTitle || 'YouTube Playlist';
                let addedCount = 0;
                
                // Load each video
                for (const item of data.items) {
                    const videoId = item.snippet.resourceId.videoId;
                    
                    if (!playlist.some(v => v.id === videoId)) {
                        // Use thumbnail from API, skip full video loading
                        playlist.push({
                            id: videoId,
                            title: item.snippet.title,
                            thumb: item.snippet.thumbnails.medium?.url || `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`,
                            description: item.snippet.description || '',
                            channel: item.snippet.channelTitle,
                            date: new Date().toLocaleDateString('ru-RU'),
                            group: playlistTitle
                        });
                        addedCount++;
                    }
                }
                
                if (addedCount > 0) {
                    await savePlaylist();
                    showToast(`✅ Добавлено ${addedCount} видео из плейлиста`);
                } else {
                    showToast('⚠️ Все видео уже в плейлисте');
                }
                
            } catch (error) {
                console.error(error);
                showToast('❌ Ошибка загрузки плейлиста');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Добавить';
            }
        }

        // YouTube Search (original version with fallback)
        window.searchYouTube = async () => {
            const input = document.getElementById('search-input');
            const query = input.value.trim();
            
            if (!query) {
                showToast('❌ Введите запрос');
                return;
            }
            
            const btn = document.getElementById('searchBtn');
            const btnText = document.getElementById('searchBtnText');
            
            btn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span>';
            
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('search-results-container').style.display = 'block';
            
            try {
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=20&key=${YOUTUBE_API_KEY}`;
                const res = await fetch(url);
                const data = await res.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }
                
                if (!data.items || data.items.length === 0) {
                    renderSearchResults([]);
                    showToast('⚠️ Ничего не найдено');
                    return;
                }
                
                searchResults = data.items;
                renderSearchResults();
                showToast(`✅ Найдено ${searchResults.length} видео`);
                
            } catch (error) {
                console.error(error);
                // Show fallback message
                document.getElementById('results-list').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <p style="color: var(--text-secondary); margin-bottom: 20px;">
                            YouTube API недоступен: ${error.message}<br><br>
                            Используйте прямой поиск на YouTube:
                        </p>
                        <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(query)}" 
                           target="_blank" 
                           class="action-btn" 
                           style="display: inline-block; text-decoration: none;">
                            Открыть поиск на YouTube
                        </a>
                        <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 15px;">
                            Найдите нужное видео, скопируйте ссылку<br>
                            и вставьте во вкладке "Добавить"
                        </p>
                    </div>
                `;
                showToast('⚠️ API недоступен - используйте YouTube');
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Искать';
            }
        };

        function renderSearchResults() {
            const container = document.getElementById('results-list');
            
            if (!searchResults || searchResults.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <h3>Ничего не найдено</h3>
                        <p>Попробуйте изменить поисковый запрос</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = '';
            
            searchResults.forEach((result, index) => {
                const videoId = result.id.videoId;
                const title = result.snippet.title;
                const channel = result.snippet.channelTitle;
                const thumb = result.snippet.thumbnails.medium.url;
                const publishedAt = new Date(result.snippet.publishedAt).toLocaleDateString('ru-RU');
                
                const alreadyAdded = playlist.some(v => v.id === videoId);
                
                const item = document.createElement('div');
                item.className = 'search-item-row';
                item.innerHTML = `
                    <img src="${thumb}" onclick="playFromSearch('${videoId}', '${title.replace(/'/g, "\\'")}')">
                    <div class="search-item-info">
                        <div class="search-title" onclick="playFromSearch('${videoId}', '${title.replace(/'/g, "\\'")}')">
                            ${title}
                        </div>
                        <div class="search-channel">${channel}</div>
                        <div class="search-channel">📅 ${publishedAt}</div>
                        <button 
                            class="add-btn ${alreadyAdded ? 'added' : ''}" 
                            onclick="addFromSearch(${index})"
                            ${alreadyAdded ? 'disabled' : ''}
                        >
                            ${alreadyAdded ? '✅ Уже в плейлисте' : '+ Добавить в плейлист'}
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        window.addFromSearch = async (index) => {
            if (!currentUser) {
                showToast('⚠️ Сначала войдите в аккаунт');
                return;
            }
            
            const result = searchResults[index];
            const videoId = result.id.videoId;
            
            if (playlist.some(v => v.id === videoId)) {
                showToast('⚠️ Видео уже в плейлисте');
                return;
            }
            
            updateSync('syncing');
            
            try {
                // Use data from search results (already have title, thumb, etc.)
                const newVideo = {
                    id: videoId,
                    title: result.snippet.title,
                    thumb: result.snippet.thumbnails.medium.url,
                    description: result.snippet.description || '',
                    channel: result.snippet.channelTitle,
                    date: new Date().toLocaleDateString('ru-RU'),
                    group: 'Из поиска'
                };
                
                playlist.unshift(newVideo);
                await savePlaylist();
                renderSearchResults();
                showToast('✅ Добавлено в плейлист');
                
            } catch (error) {
                console.error(error);
                showToast('❌ Ошибка добавления');
            }
        };

        // Render Playlist
        function renderPlaylist() {
            const container = document.getElementById('playlist-container');
            const countEl = document.getElementById('playlistCount');
            
            countEl.textContent = playlist.length + ' видео';
            
            if (playlist.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">📺</div><p>Плейлист пуст</p></div>';
                return;
            }
            
            // Group by group name
            const groups = {};
            playlist.forEach((video, index) => {
                const group = video.group || 'Без группы';
                if (!groups[group]) groups[group] = [];
                groups[group].push({ video, index });
            });
            
            container.innerHTML = '';
            
            Object.keys(groups).forEach(groupName => {
                const section = document.createElement('div');
                section.className = 'group-section';
                
                const header = document.createElement('div');
                header.className = 'group-header';
                header.textContent = `${groupName} (${groups[groupName].length})`;
                section.appendChild(header);
                
                groups[groupName].forEach(({ video, index }) => {
                    const item = document.createElement('div');
                    item.className = 'video-item';
                    item.draggable = true;
                    item.innerHTML = `
                        <img src="${video.thumb}" onclick="playVideo(${index})">
                        <div class="video-item-info">
                            <div class="video-title-small" onclick="playVideo(${index})">${video.title}</div>
                            <div class="video-meta-small">
                                <span>${video.date}</span>
                                <span class="delete-icon" onclick="deleteVideo(${index})" title="Удалить">&times;</span>
                            </div>
                        </div>
                    `;
                    
                    // Drag & Drop
                    item.addEventListener('dragstart', (e) => {
                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('text/plain', index);
                        item.classList.add('dragging');
                    });
                    
                    item.addEventListener('dragend', () => {
                        item.classList.remove('dragging');
                    });
                    
                    item.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                    });
                    
                    item.addEventListener('drop', async (e) => {
                        e.preventDefault();
                        const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
                        const toIndex = index;
                        
                        if (fromIndex !== toIndex) {
                            const item = playlist.splice(fromIndex, 1)[0];
                            playlist.splice(toIndex, 0, item);
                            await savePlaylist();
                        }
                    });
                    
                    section.appendChild(item);
                });
                
                container.appendChild(section);
            });
        }

        // Delete video
        window.deleteVideo = async (index) => {
            if (confirm('Удалить это видео из плейлиста?')) {
                playlist.splice(index, 1);
                await savePlaylist();
                showToast('🗑️ Видео удалено');
            }
        };

        // Play video
        window.playVideo = (index) => {
            const video = playlist[index];
            openPlayer(video);
        };

        window.playFromSearch = (videoId, title) => {
            const video = playlist.find(v => v.id === videoId);
            if (video) {
                openPlayer(video);
            } else {
                openPlayer({ id: videoId, title, description: 'Видео из поиска' });
            }
        };

        function openPlayer(video) {
            document.getElementById('player-overlay').style.display = 'flex';
            document.getElementById('player-box').innerHTML = `
                <iframe 
                    width="100%" 
                    height="100%" 
                    src="https://www.youtube.com/embed/${video.id}?autoplay=1" 
                    frameborder="0" 
                    allow="autoplay; encrypted-media" 
                    allowfullscreen
                ></iframe>
            `;
            
            if (video.description) {
                document.getElementById('player-info').style.display = 'block';
                document.getElementById('player-title').textContent = video.title;
                document.getElementById('player-description').textContent = video.description;
            } else {
                document.getElementById('player-info').style.display = 'none';
            }
        }

        window.closePlayer = () => {
            document.getElementById('player-overlay').style.display = 'none';
            document.getElementById('player-box').innerHTML = '';
        };

        // Tabs
        window.switchTab = (tab) => {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tab === 'add') {
                document.getElementById('add-tab').style.display = 'block';
                document.getElementById('search-tab').style.display = 'none';
                document.getElementById('search-results-container').style.display = 'none';
                document.getElementById('welcome-screen').style.display = 'block';
            } else if (tab === 'search') {
                document.getElementById('add-tab').style.display = 'none';
                document.getElementById('search-tab').style.display = 'block';
                document.getElementById('welcome-screen').style.display = 'none';
            }
        };

        // Helpers
        function extractVideoId(url) {
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/,
                /^([a-zA-Z0-9_-]{11})$/
            ];
            
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }
            return false;
        }

        function extractPlaylistId(url) {
            const match = url.match(/[?&]list=([^&]+)/);
            return match ? match[1] : false;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Event listeners
        document.getElementById('main-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleAdd();
        });

        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchYouTube();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePlayer();
        });
    </script>
</body>
</html>
