<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PPTX Деструктор</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; padding: 20px; background-color: #eef2f3; color: #333; }
        .container { max-width: 1000px; margin: auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { border-bottom: 2px solid #0078d4; padding-bottom: 10px; color: #0078d4; }
        .upload-area { border: 2px dashed #0078d4; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; cursor: pointer; transition: 0.3s; }
        .upload-area:hover { background: #f0f7ff; }
        .section { margin-top: 25px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .section h2 { margin-top: 0; font-size: 1.2em; color: #444; border-bottom: 1px solid #eee; }
        #text-output { white-space: pre-wrap; background: #f9f9f9; padding: 15px; font-size: 0.95em; max-height: 300px; overflow-y: auto; }
        .media-list { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .media-item { background: #f1f1f1; padding: 10px; border-radius: 5px; font-size: 0.85em; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .media-item a { color: #0078d4; text-decoration: none; font-weight: bold; margin-top: 5px; }
        .media-item img { max-width: 100px; max-height: 100px; margin-bottom: 5px; border-radius: 3px; }
        audio { width: 100%; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔧 PPTX Деструктор (Разбор по косточкам)</h1>
    
    <div class="upload-area" onclick="document.getElementById('file-input').click()">
        <strong>Нажми сюда, чтобы выбрать файл .pptx</strong>
        <input type="file" id="file-input" accept=".pptx" style="display:none">
    </div>

    <div id="results" style="display:none">
        <div class="section">
            <h2>📝 Весь текст из слайдов:</h2>
            <div id="text-output"></div>
        </div>

        <div class="section">
            <h2>🖼️ Картинки (Images):</h2>
            <ul id="images-list" class="media-list"></ul>
        </div>

        <div class="section">
            <h2>🎵 Звуки и Видео (Audio/Video):</h2>
            <ul id="media-list" class="media-list"></ul>
        </div>
    </div>
</div>

<script>
    document.getElementById('file-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('results').style.display = 'block';
        document.getElementById('text-output').innerText = "Обработка...";
        document.getElementById('images-list').innerHTML = "";
        document.getElementById('media-list').innerHTML = "";

        JSZip.loadAsync(file).then(async function(zip) {
            // 1. ВЫТЯГИВАЕМ ТЕКСТ
            const slideFiles = Object.keys(zip.files).filter(name => name.startsWith("ppt/slides/slide"));
            slideFiles.sort((a, b) => a.length - b.length || a.localeCompare(b));
            
            let allText = "";
            for (let name of slideFiles) {
                const xml = await zip.file(name).async("text");
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xml, "text/xml");
                const textNodes = xmlDoc.getElementsByTagName("a:t");
                let slideText = Array.from(textNodes).map(n => n.textContent).join(" ");
                if(slideText.trim()) allText += `--- Слайд ${name.match(/\d+/)} ---\n${slideText}\n\n`;
            }
            document.getElementById('text-output').innerText = allText || "Текст не найден";

            // 2. ВЫТЯГИВАЕМ МЕДИА
            const mediaFiles = Object.keys(zip.files).filter(name => name.startsWith("ppt/media/"));
            
            for (let name of mediaFiles) {
                const blob = await zip.file(name).async("blob");
                const url = URL.createObjectURL(blob);
                const fileName = name.replace("ppt/media/", "");
                
                const li = document.createElement('li');
                li.className = 'media-item';

                if (fileName.match(/\.(jpg|jpeg|png|gif|svg)$/i)) {
                    // Если это картинка - показываем превью
                    li.innerHTML = `<img src="${url}"><a href="${url}" download="${fileName}">${fileName}</a>`;
                    document.getElementById('images-list').appendChild(li);
                } else {
                    // Если это аудио, видео или другое
                    let player = "";
                    if (fileName.match(/\.(mp3|wav|ogg|m4a)$/i)) {
                        player = `<audio controls src="${url}"></audio>`;
                    }
                    li.innerHTML = `<span>📂 ${fileName}</span>${player}<a href="${url}" download="${fileName}">Скачать файл</a>`;
                    document.getElementById('media-list').appendChild(li);
                }
            }
        }).catch(err => alert("Ошибка разбора: " + err.message));
    });
</script>

</body>
</html>
