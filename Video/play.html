<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Video Player | GitHub Edition</title>
    <style>
        :root {
            --gh-bg: #0d1117;
            --gh-card: #161b22;
            --gh-border: #30363d;
            --accent: #2f81f7;
            --text: #c9d1d9;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--gh-bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .player-card {
            background-color: var(--gh-card);
            border: 1px solid var(--gh-border);
            border-radius: 12px;
            width: 90%;
            max-width: 1000px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--gh-border);
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 1.2rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--gh-border);
        }

        video {
            width: 100%;
            height: 100%;
            outline: none;
        }

        .info {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background: rgba(47, 129, 247, 0.15);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--accent);
        }

        .gh-link {
            color: #8b949e;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .gh-link:hover {
            color: var(--accent);
        }

        /* Кастомный скроллбар в стиле GH */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--gh-bg); }
        ::-webkit-scrollbar-thumb { background: var(--gh-border); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="header">
            <h1>
                <svg height="24" viewBox="0 0 16 16" width="24" fill="currentColor">
                    <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
                </svg>
                Lyrics Video Showcase
            </h1>
        </div>

        <div class="video-wrapper">
            <video controls poster="">
                <source src="lyrics_video.webm" type="video/webm">
                Ваш браузер не поддерживает встроенные видео.
            </video>
        </div>

        <div class="info">
            <div>
                <span class="badge">WebM / VP9</span>
                <span style="margin-left: 10px; font-size: 0.9rem; color: #8b949e;">Created with AI Canvas Editor</span>
            </div>
            <a href="#" class="gh-link" onclick="location.href=window.location.href.split('.github.io')[0].replace('https://', 'https://github.com/')">View Source Code</a>
        </div>
    </div>

    <script>
        // Небольшой хак: если видео не грузится, выводим ошибку в консоль
        const video = document.querySelector('video');
        video.onerror = function() {
            console.error("Ошибка: Файл lyrics_video.webm не найден в корне репозитория.");
            alert("Файл 'lyrics_video.webm' не найден. Убедитесь, что он лежит в корне вашего репозитория.");
        };
    </script>
</body>
</html>
