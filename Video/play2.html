<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Lyrics Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.3s ease;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Сохраняем пропорции видео */
        }

        /* --- Твоя фишка: Поворот для портретного режима --- */
        @media screen and (max-width: 768px) and (orientation: portrait) {
            .player-container {
                transform: rotate(90deg);
                width: 100vh;  /* Высота становится шириной */
                height: 100vw; /* Ширина становится высотой */
                position: absolute;
                transform-origin: center center;
            }
        }

        /* Большая кнопка Play */
        .play-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: rgba(0,0,0,0.2);
            transition: opacity 0.4s;
        }
        
        .play-overlay.hidden { opacity: 0; pointer-events: none; }

        .big-play-btn {
            width: 90px; height: 90px;
            background: #2f81f7;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(47, 129, 247, 0.5);
        }
        .big-play-btn::after {
            content: '';
            border-left: 30px solid #fff;
            border-top: 18px solid transparent;
            border-bottom: 18px solid transparent;
            margin-left: 8px;
        }

        /* Контролы */
        .controls {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 30px 20px 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            z-index: 20;
            transition: opacity 0.3s;
        }
        
        .controls.hide { opacity: 0; }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        
        .progress-filled {
            height: 100%;
            background: #2f81f7;
            border-radius: 3px;
            width: 0%;
        }

        .bottom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn {
            background: none; border: none; color: #fff;
            font-size: 24px; cursor: pointer; padding: 5px 15px;
        }

        .time-info { font-size: 14px; color: #aaa; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>

    <div class="player-container" id="mainContainer">
        <video id="v" playsinline webkit-playsinline>
            <source src="lyrics_video.webm" type="video/webm">
            <source src="lyrics_video.mp4" type="video/mp4">
        </video>

        <div class="play-overlay" id="overlay">
            <div class="big-play-btn"></div>
        </div>

        <div class="controls" id="ctrl">
            <div class="progress-bar" id="pBar">
                <div class="progress-filled" id="pFill"></div>
            </div>
            <div class="bottom-row">
                <button class="btn" id="pPause">▶</button>
                <div class="time-info" id="tInfo">0:00 / 0:00</div>
                <button class="btn" id="mMute">🔊</button>
            </div>
        </div>
    </div>

    <script>
        const v = document.getElementById('v');
        const overlay = document.getElementById('overlay');
        const pPause = document.getElementById('pPause');
        const pFill = document.getElementById('pFill');
        const pBar = document.getElementById('pBar');
        const tInfo = document.getElementById('tInfo');
        const ctrl = document.getElementById('ctrl');
        const mMute = document.getElementById('mMute');

        // Логика Play/Pause
        const toggle = () => {
            if(v.paused) {
                v.play();
                pPause.textContent = '⏸';
                overlay.classList.add('hidden');
            } else {
                v.pause();
                pPause.textContent = '▶';
                overlay.classList.remove('hidden');
            }
        };

        overlay.onclick = toggle;
        pPause.onclick = (e) => { e.stopPropagation(); toggle(); };
        v.onclick = toggle;

        // Звук
        mMute.onclick = (e) => {
            e.stopPropagation();
            v.muted = !v.muted;
            mMute.textContent = v.muted ? '🔇' : '🔊';
        };

        // Обновление прогресса
        v.ontimeupdate = () => {
            const pct = (v.currentTime / v.duration) * 100;
            pFill.style.width = pct + '%';
            tInfo.textContent = `${fmt(v.currentTime)} / ${fmt(v.duration)}`;
        };

        pBar.onclick = (e) => {
            const rect = pBar.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            v.currentTime = pos * v.duration;
        };

        const fmt = (s) => {
            if(isNaN(s)) return '0:00';
            const m = Math.floor(s/60);
            const r = Math.floor(s%60);
            return `${m}:${r < 10 ? '0'+r : r}`;
        };

        // Скрытие контролов
        let timer;
        const hide = () => { if(!v.paused) ctrl.classList.add('hide'); };
        const show = () => { 
            ctrl.classList.remove('hide'); 
            clearTimeout(timer);
            timer = setTimeout(hide, 3000);
        };

        document.addEventListener('mousemove', show);
        document.addEventListener('touchstart', show);
        v.onplay = show;
    </script>
</body>
</html>
