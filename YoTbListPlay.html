<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>My Personal YT Studio</title>
    <style>
        :root { --bg: #0f0f0f; --panel: #1e1e1e; --accent: #ff0000; --text: #f1f1f1; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Левая панель - Плейлист */
        .sidebar { width: 350px; background: var(--panel); border-right: 1px solid #333; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #333; }
        .playlist-items { flex-grow: 1; overflow-y: auto; padding: 10px; }
        
        /* Центральная часть - Плеер и Главы */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        
        /* Карточка видео в списке */
        .video-item { 
            display: flex; gap: 10px; padding: 10px; margin-bottom: 10px; 
            background: #2a2a2a; border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        .video-item:hover { background: #3a3a3a; }
        .video-item img { width: 100px; border-radius: 4px; object-fit: cover; }
        .video-item-info { font-size: 13px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; }

        /* Стили для глав и ввода */
        input { width: calc(100% - 24px); padding: 10px; border-radius: 6px; border: 1px solid #444; background: #000; color: #fff; margin-bottom: 10px; }
        .chapters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 20px; }
        .chapter-btn { background: #333; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 12px; border: 1px solid transparent; }
        .chapter-btn:hover { border-color: var(--accent); }
        #player { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h3>Мой Плейлист</h3>
            <input type="text" id="video-url" placeholder="Вставьте ссылку...">
            <button onclick="addVideoToList()" style="width:100%; padding: 10px; background: red; color: white; border: none; border-radius: 6px; cursor: pointer;">Добавить в список</button>
        </div>
        <div class="playlist-items" id="playlist">
            </div>
    </div>

    <div class="main-content">
        <div id="player"></div>
        <h2 id="current-title">Выберите видео из списка</h2>
        <div class="chapters-grid" id="chapters-list"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const API_KEY = 'AIzaSyB79LenCkfDqTFbrVMRVoAqRp5Wpzy_2Dg'; // Твой ключ
        let player;
        let myVideos = JSON.parse(localStorage.getItem('my_yt_playlist')) || [];

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', { videoId: '', playerVars: { 'modestbranding': 1 } });
            renderPlaylist();
        }

        async function addVideoToList() {
            const url = document.getElementById('video-url').value;
            const id = extractID(url);
            if (!id) return alert("Ошибка в ссылке");

            const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${id}&key=${API_KEY}`);
            const data = await res.json();
            const videoData = data.items[0];

            const newVideo = {
                id: id,
                title: videoData.snippet.title,
                thumb: videoData.snippet.thumbnails.medium.url,
                description: videoData.snippet.description
            };

            myVideos.push(newVideo);
            localStorage.setItem('my_yt_playlist', JSON.stringify(myVideos));
            document.getElementById('video-url').value = '';
            renderPlaylist();
        }

        function renderPlaylist() {
            const container = document.getElementById('playlist');
            container.innerHTML = '';
            myVideos.forEach((video, index) => {
                const item = document.createElement('div');
                item.className = 'video-item';
                item.innerHTML = `
                    <img src="${video.thumb}">
                    <div class="video-item-info">${video.title}</div>
                `;
                item.onclick = () => loadVideo(index);
                container.appendChild(item);
            });
        }

        function loadVideo(index) {
            const video = myVideos[index];
            player.loadVideoById(video.id);
            document.getElementById('current-title').innerText = video.title;
            
            // Парсим главы
            const chapters = parseDescription(video.description);
            renderChapters(chapters);
        }

        function parseDescription(text) {
            const chapters = [];
            const regex = /^.*?(\d{1,2}:)?(\d{1,2}):(\d{2}).*$/gm;
            let match;
            while ((match = regex.exec(text)) !== null) {
                const timeStr = match[0].match(/(\d{1,2}:)?(\d{1,2}):(\d{2})/)[0];
                chapters.push({ time: timeToSeconds(timeStr), label: match[0].replace(timeStr, '').trim() || "Трек" });
            }
            return chapters;
        }

        function renderChapters(chapters) {
            const list = document.getElementById('chapters-list');
            list.innerHTML = chapters.length ? '' : 'В этом видео нет глав в описании.';
            chapters.forEach(ch => {
                const btn = document.createElement('div');
                btn.className = 'chapter-btn';
                btn.innerText = ch.label;
                btn.onclick = () => player.seekTo(ch.time, true);
                list.appendChild(btn);
            });
        }

        function timeToSeconds(s) {
            const p = s.split(':'); let r = 0, m = 1;
            while (p.length > 0) { r += m * parseInt(p.pop(), 10); m *= 60; }
            return r;
        }

        function extractID(url) {
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:v\/|u\/\w\/|embed\/|watch\?v=))([^#\&\?]*)/);
            return (match && match[1].length === 11) ? match[1] : false;
        }
    </script>
</body>
</html>
