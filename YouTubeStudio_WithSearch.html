<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My YouTube Studio - Social Cloud</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
--bg: #0f0f0f;
--bg-secondary: #181818;
--panel: #212121;
--panel-hover: #2a2a2a;
--accent: #ff0000;
--accent-hover: #cc0000;
--text: #f1f1f1;
--text-secondary: #aaaaaa;
--border: #3a3a3a;
--success: #10b981;
--blue: #3b82f6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: 'Roboto', sans-serif;
background: var(--bg);
color: var(--text);
overflow-x: hidden;
}
/* Header */
header {
background: var(--bg-secondary);
padding: 12px 16px;
display: flex;
justify-content: space-between;
align-items: center;
border-bottom: 1px solid var(--border);
position: sticky;
top: 0;
z-index: 1000;
}
.logo {
color: var(--accent);
font-weight: bold;
font-size: 18px;
letter-spacing: 1px;
}
.user-section {
display: flex;
align-items: center;
gap: 10px;
}
.user-info {
display: none;
}
.user-name, .user-email {
display: none;
}
.user-avatar {
width: 32px;
height: 32px;
border-radius: 50%;
cursor: pointer;
border: 2px solid var(--border);
transition: all 0.2s;
}
.user-avatar:hover {
border-color: var(--accent);
transform: scale(1.05);
}
.signin-btn {
background: var(--accent);
color: white;
border: none;
padding: 8px 16px;
border-radius: 6px;
cursor: pointer;
font-weight: 500;
transition: all 0.2s;
font-size: 0.9rem;
}
.signin-btn:hover {
background: var(--accent-hover);
}
.logout-btn {
background: transparent;
color: var(--text-secondary);
border: 1px solid var(--border);
padding: 6px 12px;
border-radius: 6px;
cursor: pointer;
font-size: 0.8rem;
transition: all 0.2s;
}
.logout-btn:hover {
background: var(--panel-hover);
color: var(--text);
}
/* Main Tabs */
.main-tabs {
display: flex;
gap: 6px;
padding: 12px 16px;
background: var(--bg-secondary);
border-bottom: 2px solid var(--border);
justify-content: center;
overflow-x: auto;
}
.main-tab {
padding: 8px 16px;
background: transparent;
border: 1px solid var(--border);
color: var(--text-secondary);
border-radius: 20px;
cursor: pointer;
font-size: 0.85rem;
font-weight: 500;
transition: all 0.2s;
white-space: nowrap;
}
.main-tab:hover {
background: var(--panel-hover);
color: var(--text);
}
.main-tab.active {
background: var(--accent);
color: white;
border-color: var(--accent);
}
/* Sync Status */
.sync-badge {
padding: 4px 10px;
background: var(--panel);
border: 1px solid var(--border);
border-radius: 20px;
font-size: 0.75rem;
display: flex;
align-items: center;
gap: 4px;
}
.sync-dot {
width: 5px;
height: 5px;
border-radius: 50%;
background: var(--success);
animation: blink 2s infinite;
}
@keyframes blink {
0%, 100% { opacity: 1; }
50% { opacity: 0.3; }
}
.sync-dot.syncing {
background: var(--blue);
animation: pulse 1s infinite;
}
@keyframes pulse {
0%, 100% { opacity: 1; }
50% { opacity: 0.5; }
}
/* Main Container */
.container {
max-width: 100%;
margin: 0 auto;
padding: 12px;
}
.controls-section {
background: var(--panel);
padding: 12px;
border-radius: 12px;
border: 1px solid var(--border);
margin-bottom: 16px;
}
.tabs {
display: flex;
gap: 6px;
border-bottom: 2px solid var(--border);
margin-bottom: 10px;
overflow-x: auto;
}
.tab-btn {
padding: 8px 16px;
background: transparent;
border: none;
color: var(--text-secondary);
cursor: pointer;
font-size: 0.85rem;
font-weight: 500;
border-bottom: 3px solid transparent;
margin-bottom: -2px;
transition: all 0.2s;
white-space: nowrap;
}
.tab-btn:hover {
color: var(--text);
}
.tab-btn.active {
color: var(--accent);
border-bottom-color: var(--accent);
}
.input-row {
display: flex;
gap: 8px;
margin-bottom: 10px;
flex-wrap: wrap;
}
.input-field {
flex: 1;
min-width: 150px;
padding: 10px 12px;
border-radius: 8px;
border: 1px solid var(--border);
background: var(--bg-secondary);
color: var(--text);
outline: none;
font-size: 0.9rem;
}
.input-field:focus {
border-color: var(--accent);
}
.input-field:disabled {
opacity: 0.5;
cursor: not-allowed;
}
.action-btn {
background: var(--accent);
color: white;
border: none;
padding: 10px 16px;
border-radius: 8px;
cursor: pointer;
font-weight: 500;
transition: all 0.2s;
white-space: nowrap;
font-size: 0.9rem;
}
.action-btn:hover {
background: var(--accent-hover);
}
.action-btn:disabled {
opacity: 0.5;
cursor: not-allowed;
}
/* Video Grid - Современный дизайн карточек */
.video-grid {
display: flex;
flex-direction: column;
gap: 10px;
}
.video-card {
background: var(--panel);
border-radius: 10px;
overflow: hidden;
border: 1px solid var(--border);
transition: all 0.2s;
position: relative;
will-change: transform;
display: flex;
align-items: center;
gap: 10px;
cursor: pointer;
}
.video-card:hover {
transform: translateX(4px);
box-shadow: 0 6px 16px rgba(0,0,0,0.3);
border-color: var(--accent);
}
.video-thumb {
width: 100px;
height: 60px;
object-fit: cover;
border-radius: 6px;
flex-shrink: 0;
}
.video-info {
flex: 1;
padding: 8px 10px 8px 0;
display: flex;
flex-direction: column;
gap: 4px;
}
.owner-badge {
display: inline-block;
padding: 2px 6px;
background: var(--blue);
color: white;
border-radius: 8px;
font-size: 0.6rem;
font-weight: 600;
width: fit-content;
}
.owner-badge.you {
background: var(--success);
}
.video-title {
font-size: 0.75rem;
font-weight: 500;
line-height: 1.3;
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
overflow: hidden;
}
.video-meta {
display: flex;
justify-content: space-between;
align-items: center;
font-size: 0.6rem;
color: var(--text-secondary);
}
.video-actions {
display: flex;
gap: 6px;
margin-top: 6px;
}
.action-icon-btn {
background: var(--bg-secondary);
border: 1px solid var(--border);
color: var(--text-secondary);
padding: 4px 8px;
border-radius: 6px;
cursor: pointer;
font-size: 0.65rem;
transition: all 0.2s;
}
.action-icon-btn:hover {
background: var(--panel-hover);
color: var(--text);
}
.action-icon-btn.delete:hover {
background: var(--accent);
color: white;
border-color: var(--accent);
}
.action-icon-btn.add:hover {
background: var(--success);
color: white;
border-color: var(--success);
}
/* Search Results */
.search-results-container {
background: var(--bg-secondary);
border-radius: 12px;
border: 1px solid var(--border);
padding: 16px;
display: none;
max-height: 60vh;
overflow-y: auto;
}
.search-item-row {
display: flex;
gap: 12px;
margin-bottom: 12px;
background: var(--panel);
padding: 10px;
border-radius: 8px;
align-items: center;
border: 1px solid var(--border);
transition: all 0.2s;
}
.search-item-row:hover {
border-color: var(--accent);
background: var(--panel-hover);
}
.search-item-row img {
width: 120px;
border-radius: 6px;
cursor: pointer;
}
.search-item-info {
flex: 1;
}
.search-title {
font-size: 0.9rem;
font-weight: 500;
margin-bottom: 6px;
cursor: pointer;
line-height: 1.3;
}
.search-title:hover {
color: var(--accent);
}
.search-channel {
font-size: 0.75rem;
color: var(--text-secondary);
margin-bottom: 4px;
}
.add-btn {
background: var(--success);
color: white;
border: none;
padding: 8px 14px;
border-radius: 6px;
cursor: pointer;
font-size: 0.8rem;
font-weight: 500;
transition: all 0.2s;
}
.add-btn:hover {
background: #059669;
}
.add-btn.added {
background: #6b7280;
cursor: default;
}
/* Empty State */
.empty-state {
text-align: center;
padding: 40px 16px;
color: var(--text-secondary);
}
.empty-icon {
font-size: 3rem;
margin-bottom: 12px;
opacity: 0.3;
}
.empty-state h3 {
font-size: 1rem;
margin-bottom: 6px;
color: var(--text);
}
.empty-state p {
font-size: 0.85rem;
}
/* Search Bar - НОВЫЙ */
.playlist-search-bar {
background: var(--panel);
padding: 12px;
border-radius: 12px;
border: 1px solid var(--border);
margin-bottom: 12px;
}
.search-container {
display: flex;
gap: 8px;
margin-bottom: 10px;
}
.search-input-wrapper {
flex: 1;
position: relative;
}
.search-icon {
position: absolute;
left: 12px;
top: 50%;
transform: translateY(-50%);
color: var(--text-secondary);
font-size: 1rem;
pointer-events: none;
}
.playlist-search-input {
width: 100%;
padding: 10px 12px 10px 36px;
border-radius: 8px;
border: 1px solid var(--border);
background: var(--bg-secondary);
color: var(--text);
outline: none;
font-size: 0.9rem;
transition: all 0.3s;
}
.playlist-search-input:focus {
border-color: var(--accent);
box-shadow: 0 0 0 3px rgba(255,0,0,0.1);
}
.clear-search-btn {
background: transparent;
color: var(--text-secondary);
border: 1px solid var(--border);
padding: 10px 16px;
border-radius: 8px;
cursor: pointer;
font-size: 0.85rem;
transition: all 0.2s;
white-space: nowrap;
}
.clear-search-btn:hover {
background: var(--panel-hover);
color: var(--text);
}
.filter-sort-controls {
display: flex;
gap: 8px;
flex-wrap: wrap;
}
.filter-btn, .sort-btn {
padding: 6px 12px;
background: var(--bg-secondary);
border: 1px solid var(--border);
color: var(--text-secondary);
border-radius: 6px;
cursor: pointer;
font-size: 0.75rem;
transition: all 0.2s;
white-space: nowrap;
}
.filter-btn:hover, .sort-btn:hover {
background: var(--panel-hover);
color: var(--text);
}
.filter-btn.active {
background: var(--blue);
color: white;
border-color: var(--blue);
}
.sort-btn.active {
background: #8b5cf6;
color: white;
border-color: #8b5cf6;
}
.stats-bar {
background: var(--panel);
padding: 8px 12px;
border-radius: 8px;
border: 1px solid var(--border);
margin-bottom: 12px;
display: flex;
justify-content: space-between;
align-items: center;
font-size: 0.75rem;
color: var(--text-secondary);
}
.stat-item {
display: flex;
align-items: center;
gap: 4px;
}
/* Player Modal - Полноэкранный на мобильных */
#player-modal {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: #000;
display: none;
justify-content: center;
align-items: center;
z-index: 9999;
}
.close-player {
position: absolute;
top: 12px;
right: 16px;
font-size: 32px;
color: white;
cursor: pointer;
width: 44px;
height: 44px;
display: flex;
align-items: center;
justify-content: center;
border-radius: 50%;
transition: all 0.2s;
z-index: 10000;
}
.close-player:hover {
background: rgba(0,0,0,0.5);
color: var(--accent);
}
.player-container {
width: 100%;
max-width: 100%;
display: flex;
flex-direction: column;
gap: 0;
height: 100vh;
}
.player-box {
width: 100%;
height: auto;
aspect-ratio: 16/9;
max-height: 70vh;
border-radius: 0;
overflow: hidden;
box-shadow: none;
background: #000;
}
.player-info {
background: var(--panel);
padding: 16px;
border-radius: 0;
border: none;
border-top: 1px solid var(--border);
max-height: 30vh;
overflow-y: auto;
}
.player-title {
font-size: 1rem;
font-weight: 600;
margin-bottom: 10px;
}
.player-owner {
font-size: 0.85rem;
color: var(--text-secondary);
margin-bottom: 10px;
}
.player-description {
color: var(--text-secondary);
font-size: 0.85rem;
line-height: 1.5;
white-space: pre-wrap;
}
/* Toast */
.toast {
position: fixed;
bottom: -100px;
left: 50%;
transform: translateX(-50%);
background: var(--panel);
padding: 12px 20px;
border-radius: 8px;
border: 1px solid var(--border);
box-shadow: 0 8px 20px rgba(0,0,0,0.4);
z-index: 10000;
transition: bottom 0.3s;
font-size: 0.9rem;
max-width: 90%;
text-align: center;
}
.toast.show {
bottom: 20px;
}
/* Loading */
.loading {
border: 2px solid rgba(255,255,255,0.2);
border-top: 2px solid white;
border-radius: 50%;
width: 16px;
height: 16px;
animation: spin 0.6s linear infinite;
display: inline-block;
}
@keyframes spin {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}
/* Auth Screen */
#auth-screen {
display: flex;
height: 80vh;
align-items: center;
justify-content: center;
flex-direction: column;
padding: 0 16px;
}
#auth-screen h1 {
margin-bottom: 16px;
font-size: 1.8rem;
text-align: center;
}
#auth-screen p {
margin-bottom: 24px;
color: var(--text-secondary);
font-size: 0.95rem;
text-align: center;
}
/* Scrollbar */
::-webkit-scrollbar {
width: 6px;
}
::-webkit-scrollbar-track {
background: var(--bg);
}
::-webkit-scrollbar-thumb {
background: var(--border);
border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
background: var(--text-secondary);
}
/* Mobile-specific optimizations */
@media (max-width: 768px) {
/* Header adjustments */
header {
padding: 8px 12px;
}
.logo {
font-size: 16px;
}
.user-avatar {
width: 28px;
height: 28px;
}
/* Main tabs */
.main-tabs {
padding: 8px 12px;
gap: 4px;
}
.main-tab {
padding: 6px 14px;
font-size: 0.8rem;
}
/* Container */
.container {
padding: 8px;
}
.controls-section {
padding: 10px;
margin-bottom: 12px;
border-radius: 10px;
}
.tab-btn {
padding: 6px 12px;
font-size: 0.8rem;
}
.input-field {
padding: 8px 10px;
font-size: 0.85rem;
}
.action-btn {
padding: 8px 12px;
font-size: 0.85rem;
}
/* Video cards - smaller on mobile */
.video-card {
border-radius: 8px;
gap: 8px;
}
.video-thumb {
width: 80px;
height: 45px;
border-radius: 4px;
}
.video-info {
padding: 6px 8px 6px 0;
gap: 3px;
}
.owner-badge {
padding: 2px 5px;
font-size: 0.55rem;
}
.video-title {
font-size: 0.7rem;
}
.video-meta {
font-size: 0.55rem;
}
.action-icon-btn {
padding: 3px 6px;
font-size: 0.6rem;
}
/* Search results */
.search-results-container {
padding: 12px;
max-height: 50vh;
}
.search-item-row {
padding: 8px;
margin-bottom: 10px;
}
.search-item-row img {
width: 100px;
}
.search-title {
font-size: 0.85rem;
}
.search-channel {
font-size: 0.7rem;
}
.add-btn {
padding: 6px 12px;
font-size: 0.75rem;
}
/* Empty state */
.empty-state {
padding: 30px 12px;
}
.empty-icon {
font-size: 2.5rem;
}
.empty-state h3 {
font-size: 0.9rem;
}
.empty-state p {
font-size: 0.8rem;
}
/* Player modal - FULL SCREEN on mobile */
#player-modal {
background: #000;
}
.player-container {
height: 100vh;
}
.player-box {
aspect-ratio: 16/9;
max-height: 100vh;
width: 100%;
height: auto;
border-radius: 0;
}
.player-info {
padding: 12px;
border-radius: 0;
max-height: calc(100vh - (100vh * 9/16) - 60px);
}
.player-title {
font-size: 0.95rem;
margin-bottom: 8px;
}
.player-owner {
font-size: 0.8rem;
margin-bottom: 8px;
}
.player-description {
font-size: 0.8rem;
line-height: 1.4;
}
/* Close button */
.close-player {
top: 8px;
right: 12px;
font-size: 28px;
width: 40px;
height: 40px;
}
/* Toast */
.toast {
padding: 10px 16px;
font-size: 0.85rem;
}
}
/* Extra small devices */
@media (max-width: 480px) {
.video-thumb {
width: 70px;
height: 40px;
}
.video-title {
font-size: 0.65rem;
}
.video-meta {
font-size: 0.5rem;
}
.action-icon-btn {
padding: 2px 5px;
font-size: 0.55rem;
}
}
</style>
</head>
<body>
<header>
<div class="logo">🎬 YouTube Studio</div>
<div class="user-section">
<div class="sync-badge" id="syncBadge" style="display: none;">
<div class="sync-dot" id="syncDot"></div>
<span id="syncText">Синхронизировано</span>
</div>
<div id="auth-box"></div>
</div>
</header>
<!-- Auth Screen -->
<div id="auth-screen">
<h1>🎬 YouTube Studio</h1>
<p style="margin-bottom: 24px; color: var(--text-secondary); font-size: 0.95rem;">Войдите, чтобы начать</p>
<button onclick="loginUser()" class="signin-btn" style="height: 44px; font-size: 0.95rem; padding: 0 32px;">
Войти через Google
</button>
</div>
<!-- Main Tabs -->
<div class="main-tabs" id="mainTabs" style="display: none;">
<button onclick="switchMainView('my')" id="mainTab-my" class="main-tab active">📚 Мой плейлист</button>
<button onclick="switchMainView('community')" id="mainTab-community" class="main-tab">🌐 Общая лента</button>
</div>
<!-- App Content -->
<div id="app-content" style="display: none;">
<div class="container">
<!-- Search Bar для плейлиста - НОВЫЙ -->
<div class="playlist-search-bar" id="playlistSearchBar">
<div class="search-container">
<div class="search-input-wrapper">
<span class="search-icon">🔍</span>
<input 
type="text" 
class="playlist-search-input" 
id="playlistSearchInput" 
placeholder="Поиск по названию, каналу или описанию..."
oninput="filterPlaylist()"
>
</div>
<button class="clear-search-btn" onclick="clearPlaylistSearch()">Очистить</button>
</div>
<div class="filter-sort-controls">
<button class="filter-btn active" data-group="all" onclick="filterByGroup('all')">Все</button>
<button class="filter-btn" data-group="Из поиска" onclick="filterByGroup('Из поиска')">Из поиска</button>
<button class="filter-btn" data-group="Из общей ленты" onclick="filterByGroup('Из общей ленты')">Из общей ленты</button>
<button class="filter-btn" data-group="Одиночные видео" onclick="filterByGroup('Одиночные видео')">Одиночные</button>
<span style="border-left: 1px solid var(--border); height: 20px; margin: 0 4px;"></span>
<button class="sort-btn" onclick="sortPlaylist('date-new')">📅 Новые</button>
<button class="sort-btn" onclick="sortPlaylist('date-old')">📅 Старые</button>
<button class="sort-btn" onclick="sortPlaylist('title')">🔤 По названию</button>
</div>
</div>

<!-- Stats Bar - НОВЫЙ -->
<div class="stats-bar" id="statsBar">
<div class="stat-item">
<span>📊 Всего:</span>
<span id="totalCount">0</span>
</div>
<div class="stat-item">
<span>👁️ Показано:</span>
<span id="visibleCount">0</span>
</div>
<div class="stat-item" id="selectedGroupStat" style="display: none;">
<span>🏷️ Группа:</span>
<span id="selectedGroup">Все</span>
</div>
</div>

<div class="controls-section" id="controlsSection">
<div class="tabs">
<button class="tab-btn active" onclick="switchTab('add')" id="tab-add">➕ Добавить</button>
<button class="tab-btn" onclick="switchTab('search')" id="tab-search">🔍 Поиск</button>
</div>
<div id="add-tab">
<div class="input-row">
<input type="text" id="main-input" class="input-field" placeholder="Вставьте ссылку на видео...">
<button onclick="handleAdd()" class="action-btn" id="addBtn">Добавить</button>
</div>
</div>
<div id="search-tab" style="display: none;">
<div class="input-row">
<input type="text" id="search-input" class="input-field" placeholder="Поиск на YouTube...">
<button onclick="searchYouTube()" class="action-btn" id="searchBtn">
<span id="searchBtnText">Искать</span>
</button>
</div>
</div>
</div>
<div class="search-results-container" id="searchResultsContainer">
<h4 style="margin-bottom: 12px; color: var(--text-secondary); font-size: 0.9rem;">Результаты поиска:</h4>
<div id="resultsList"></div>
</div>
<div class="video-grid" id="videoGrid"></div>
<div class="empty-state" id="emptyState">
<div class="empty-icon">📺</div>
<h3>Плейлист пуст</h3>
<p>Добавьте первое видео</p>
</div>

function renderVideos() {

// Применяем фильтр и поиск
let filteredVideos = [...allVideos];

// Фильтр по группе
if (currentFilter !== 'all') {
filteredVideos = filteredVideos.filter(v => v.group === currentFilter);
}

// Поиск
if (searchQuery) {
const query = searchQuery.toLowerCase();
filteredVideos = filteredVideos.filter(v => {
const title = (v.title || '').toLowerCase();
const channel = (v.channel || '').toLowerCase();
const description = (v.description || '').toLowerCase();
return title.includes(query) || channel.includes(query) || description.includes(query);
});
}

// Сортировка
if (currentSort) {
if (currentSort === 'date-new') {
filteredVideos.sort((a, b) => {
const dateA = parseDate(a.date);
const dateB = parseDate(b.date);
return dateB - dateA;
});
} else if (currentSort === 'date-old') {
filteredVideos.sort((a, b) => {
const dateA = parseDate(a.date);
const dateB = parseDate(b.date);
return dateA - dateB;
});
} else if (currentSort === 'title') {
filteredVideos.sort((a, b) => {
const titleA = (a.title || '').toLowerCase();
const titleB = (b.title || '').toLowerCase();
return titleA.localeCompare(titleB);
});
}
}

updateStats(allVideos.length, filteredVideos.length);

container.style.display = 'none';

function parseDate(dateStr) {
if (!dateStr) return new Date(0);
const parts = dateStr.split('.');
if (parts.length === 3) {
return new Date(parts[2], parts[1] - 1, parts[0]);
}
return new Date(dateStr);
}

// Helpers
function extractVideoId(url) {
const patterns = [
/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?#]+)/,
/^([a-zA-Z0-9_-]{11})$/
];
for (const pattern of patterns) {
const match = url.match(pattern);
if (match) return match[1];
}
return false;
}
function extractPlaylistId(url) {
const match = url.match(/[?&]list=([^&]+)/);
return match ? match[1] : false;
}
function updateSync(status) {
const dot = document.getElementById('syncDot');
const text = document.getElementById('syncText');
if (status === 'syncing') {
dot.className = 'sync-dot syncing';
text.textContent = 'Синхронизация...';
} else if (status === 'success') {
dot.className = 'sync-dot';
text.textContent = 'Синхронизировано';
}
}
function showToast(message) {
const toast = document.getElementById('toast');
toast.textContent = message;
toast.classList.add('show');
setTimeout(() => toast.classList.remove('show'), 3000);
}
// Event listeners
document.getElementById('main-input').addEventListener('keypress', (e) => {
if (e.key === 'Enter') handleAdd();
});
document.getElementById('search-input').addEventListener('keypress', (e) => {
if (e.key === 'Enter') searchYouTube();
});
document.addEventListener('keydown', (e) => {
if (e.key === 'Escape') closePlayer();
});
</script>
</body>
