<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="https://raw.githubusercontent.com/christian-word/test/main/stream_AI/ico1.jpg">
    <title>Sacred Stream | AI Music Search</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-purple: #a78bfa;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px 50px;
        }

        header { text-align: center; margin-bottom: 30px; }
        h1 {
            font-size: 2.8rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .search-container {
            width: 100%;
            max-width: 900px;
            margin-bottom: 25px;
        }

        .search-bar-wrapper {
            background: var(--card-bg);
            padding: 8px;
            border-radius: 20px;
            display: flex;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            padding: 14px 20px;
            font-size: 1.05rem;
        }

        .main-search-btn {
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        /* AI Анализатор Стили */
        #ai-analysis-container {
            display: none;
            width: 100%;
            max-width: 900px;
            background: rgba(167, 139, 250, 0.05);
            border: 1px solid var(--accent-purple);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .ai-card {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .ai-link {
            background: var(--accent-green);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        #results-area {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            min-height: 400px;
        }

        .utility-bar {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }

        .ai-status {
            color: var(--accent-purple);
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sacred Stream</h1>
        <p style="color:var(--text-dim)">Интеллектуальный AI Поиск (Суммы 2025)</p>
    </header>

    <div class="search-container">
        <div class="search-bar-wrapper">
            <input type="text" id="userInput" class="search-input" placeholder="Введите название песни или исполнителя...">
            <button class="main-search-btn" onclick="handleSearch()">
                <i class="fa-solid fa-magnifying-glass"></i> Найти
            </button>
        </div>

        <div class="utility-bar">
            <label class="ai-status">
                <input type="checkbox" id="ai-toggle" checked> AI Анализатор включен
            </label>
        </div>
    </div>

    <div id="ai-analysis-container"></div>

    <div id="results-area">
        <div class="gcse-searchresults-only"></div>
    </div>

    <script>
        // --- 1. ЛОГИКА ПОИСКА ---
        function handleSearch() {
            const query = document.getElementById('userInput').value.trim();
            if (!query) return;

            // Выполнение поиска в Google
            try {
                google.search.cse.element.getElement('results-only0').execute(query);
            } catch(e) {
                window.location.hash = 'gsc.q=' + encodeURIComponent(query);
            }

            // Запуск AI Hunter
            if (document.getElementById('ai-toggle').checked) {
                window.aiHunter.analyze(query);
            }
        }

        // --- 2. КЛАСС AI HUNTER ---
        class AIHunter {
            constructor() {
                this.apiKey = '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';
                this.apiUrl = 'https://api.groq.com/openai/v1/chat/completions';
                this.container = document.getElementById('ai-analysis-container');
            }

            async analyze(query) {
                this.container.style.display = 'block';
                this.container.innerHTML = `<div style="color:var(--accent-purple)"><i class="fas fa-spinner fa-spin"></i> AI изучает результаты поиска...</div>`;

                // Ждем загрузки результатов Google
                await new Promise(r => setTimeout(r, 2000));

                const results = Array.from(document.querySelectorAll('.gsc-result')).slice(0, 5).map(el => ({
                    title: el.querySelector('.gs-title')?.innerText || 'Без названия',
                    link: el.querySelector('.gs-title a')?.href || '#',
                    snippet: el.querySelector('.gs-snippet')?.innerText || ''
                }));

                if (results.length === 0) {
                    this.container.innerHTML = "AI не смог прочитать результаты. Попробуйте нажать 'Найти' еще раз.";
                    return;
                }

                try {
                    const response = await fetch(this.apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.apiKey}` },
                        body: JSON.stringify({
                            model: "meta-llama/llama-3.1-8b-instant",
                            messages: [{ 
                                role: "system", 
                                content: "Ты ассистент поисковика Sacred Stream. Найди среди результатов те, где вероятнее всего есть аудио или кнопка скачивания." 
                            }, { 
                                role: "user", 
                                content: `Пользователь ищет: ${query}. Результаты: ${JSON.stringify(results)}` 
                            }]
                        })
                    });
                    const data = await response.json();
                    this.render(data.choices[0].message.content, results);
                } catch (e) {
                    this.container.innerHTML = "Ошибка AI модуля. Поисковик работает в обычном режиме.";
                }
            }

            render(aiText, results) {
                let html = `<div style="font-weight:800; color:var(--accent-purple); margin-bottom:10px;"><i class="fa-solid fa-robot"></i> AI АНАЛИЗ:</div>`;
                html += `<div style="font-size:0.9rem; margin-bottom:15px; color:var(--text-main)">${aiText}</div>`;
                
                results.forEach(res => {
                    const isMusicSite = res.link.includes('fonki') || res.link.includes('kg-music') || res.link.includes('holychords');
                    html += `
                    <div class="ai-card">
                        <div style="max-width:70%">
                            <div style="color:var(--accent-blue); font-weight:700; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${res.title}</div>
                            <div style="color:var(--text-dim); font-size:11px;">${new URL(res.link).hostname}</div>
                        </div>
                        <a href="${res.link}" target="_blank" class="ai-link">
                            ${isMusicSite ? 'ОТКРЫТЬ ПЛЕЕР' : 'ПЕРЕЙТИ'}
                        </a>
                    </div>`;
                });
                this.container.innerHTML = html;
            }
        }

        window.aiHunter = new AIHunter();

        // Поиск по нажатию Enter
        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });
    </script>

    <script async src="https://cse.google.com/cse.js?cx=8679d67189c4d4455"></script>

</body>
</html>
