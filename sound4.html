<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Конспект + Аудіо + MP3 + PDF</title>

  <!-- pdfmake -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.min.js"></script>

  <!-- ffmpeg.wasm -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>

  <style>
    body { font-family:system-ui,sans-serif; background:#f8f9fa; margin:0; padding:16px; }
    .container { max-width:760px; margin:0 auto; background:white; border-radius:12px; padding:20px; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
    button { padding:10px 18px; margin:6px 4px; border:none; border-radius:8px; cursor:pointer; font-size:0.95rem; }
    .btn-primary   { background:#0d6efd; color:white; }
    .btn-success   { background:#198754; color:white; }
    .btn-danger    { background:#dc3545; color:white; }
    .btn-warning   { background:#ffc107; color:black; }
    .btn-secondary { background:#6c757d; color:white; }
    #timer { font-size:2.8rem; font-weight:bold; text-align:center; margin:20px 0; }
    .section { margin:24px 0; padding:16px; background:#f8f9fa; border-radius:10px; }
    .marker-item { padding:10px; background:#e9ecef; margin:6px 0; border-radius:6px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .marker-item input { flex:1; min-width:120px; }
    input, textarea { width:100%; padding:9px; margin:5px 0; border:1px solid #ced4da; border-radius:6px; box-sizing:border-box; }
    textarea { min-height:90px; }
    .search-box { margin:16px 0; }
    .small-btn { padding:6px 12px; font-size:0.85rem; }
  </style>
</head>
<body>

<div class="container">

  <!-- Запис -->
  <div class="section">
    <h2>Запис проповіді</h2>
    <input type="text" id="recTitle" placeholder="Назва / дата / тема">
    <div id="timer">00:00</div>
    <div style="text-align:center;">
      <button id="startRec" class="btn-primary">Почати</button>
      <button id="stopRec" class="btn-danger" disabled>Зупинити</button>
      <button id="addMarker" class="btn-warning" disabled>Маркер</button>
    </div>
    <div id="recStatus" style="text-align:center; margin:12px 0;">Готовий…</div>
    <div id="currentMarkers"><h4>Маркери</h4></div>
  </div>

  <!-- Пошук -->
  <div class="section search-box">
    <input type="text" id="searchInput" placeholder="Пошук по темі, нотатках, назві запису...">
  </div>

  <!-- Записи -->
  <div class="section">
    <h3>Збережені записи</h3>
    <div id="recordingsList"></div>
  </div>

  <!-- Конспект -->
  <div class="section">
    <h2>Конспект</h2>
    <label>Дата</label><input type="date" id="date">
    <label>Тема</label><input type="text" id="theme">
    <label>Проповідник / місце</label><input type="text" id="preacher">
    <label>Нотатки</label><textarea id="notes"></textarea>
    <label>Ключова думка</label><textarea id="keyThought"></textarea>

    <div style="margin:20px 0; text-align:center;">
      <button id="saveOutline" class="btn-primary">Зберегти конспект</button>
      <button id="exportPdf" class="btn-success">PDF</button>
      <button id="clearForm" class="btn-secondary">Очистити</button>
    </div>
  </div>

  <div class="section">
    <h3>Збережені конспекти</h3>
    <div id="savedOutlines"></div>
  </div>

</div>

<script>
// ──────────────────────────────────────────────
// IndexedDB + ffmpeg + pdfmake
// ──────────────────────────────────────────────
const { createFFmpeg, fetchFile } = FFmpeg;
const ffmpeg = createFFmpeg({ log: false }); // log:true для дебагу

const DB_NAME = "SermonDB2026";
const DB_VER = 1;
const STORE_REC = "recordings";
const OUTLINES_KEY = "sermonOutlines2026";
let db;

async function initDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      d.createObjectStore(STORE_REC, {keyPath:"id", autoIncrement:true});
    };
    req.onsuccess = e => { db = e.target.result; res(); };
    req.onerror = e => rej(e.target.error);
  });
}

// ─── Запис аудіо ───────────────────────────────────────
let mediaRecorder, audioChunks, startTime, timerInt, currentMarkers = [], currentBlob, currentRecId;

const startBtn = document.getElementById("startRec");
const stopBtn  = document.getElementById("stopRec");
const markerBtn= document.getElementById("addMarker");
const timerEl  = document.getElementById("timer");
const recStatus= document.getElementById("recStatus");
const markersCont = document.getElementById("currentMarkers");
const recTitleInp = document.getElementById("recTitle");

function formatTime(s) {
  const m = Math.floor(s/60).toString().padStart(2,"0");
  return `${m}:${(s%60).toString().padStart(2,"0")}`;
}

function updateTimer() {
  if(startTime) timerEl.textContent = formatTime(Math.floor((Date.now()-startTime)/1000));
}

function renderCurrentMarkers() {
  const cont = markersCont.querySelector("div") || document.createElement("div");
  cont.innerHTML = "";
  currentMarkers.forEach((m,i) => {
    const div = document.createElement("div");
    div.className = "marker-item";
    div.innerHTML = `
      <span>${m.label}</span>
      <input type="text" placeholder="Нотатка до маркера" value="${m.note||''}" data-index="${i}">
    `;
    cont.appendChild(div);
  });
  if (!markersCont.querySelector("div")) markersCont.appendChild(cont);

  // Збереження нотаток при зміні
  cont.querySelectorAll("input").forEach(inp => {
    inp.onchange = () => {
      const idx = inp.dataset.index;
      currentMarkers[idx].note = inp.value.trim();
    };
  });
}

markerBtn.onclick = () => {
  if(!startTime) return;
  const sec = Math.floor((Date.now()-startTime)/1000);
  const lbl = `Маркер ${currentMarkers.length+1} — ${formatTime(sec)}`;
  currentMarkers.push({time:sec, label:lbl, note:""});
  renderCurrentMarkers();
  recStatus.textContent = `Додано ${lbl}`;
};

async function startRec() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = []; currentMarkers = []; markersCont.innerHTML = "<h4>Маркери</h4>";
    startTime = Date.now();

    mediaRecorder.ondataavailable = e => e.data.size && audioChunks.push(e.data);

    mediaRecorder.onstop = async () => {
      currentBlob = new Blob(audioChunks, {type:"audio/webm"});
      const title = recTitleInp.value.trim() || new Date().toLocaleString("uk-UA");
      currentRecId = await saveRecording(title, currentBlob, currentMarkers);

      recStatus.textContent = `Збережено: ${title}`;
      startBtn.disabled = stopBtn.disabled = markerBtn.disabled = true;
      startBtn.disabled = false; stopBtn.disabled = true; markerBtn.disabled = true;

      if(confirm("Створити конспект на основі маркерів?")) fillOutlineFromAudio();
      loadRecordings(); loadOutlines();
    };

    mediaRecorder.start();
    timerInt = setInterval(updateTimer, 333);
    startBtn.disabled = true; stopBtn.disabled = false; markerBtn.disabled = false;
    recStatus.textContent = "● Запис...";
  } catch(e) { recStatus.textContent = "Помилка: "+e.message; }
}

stopBtn.onclick = () => {
  if(mediaRecorder?.state!=="inactive") {
    mediaRecorder.stop(); clearInterval(timerInt); timerEl.textContent="00:00"; startTime=null;
  }
};

// ─── Збереження / отримання записів ──────────────────────
async function saveRecording(title, blob, markers) {
  if(!db) await initDB();
  return new Promise(r => {
    const tx = db.transaction(STORE_REC,"readwrite");
    const st = tx.objectStore(STORE_REC);
    const req = st.add({title, blob, markers, created:Date.now()});
    req.onsuccess = () => r(req.result);
  });
}

async function getAllRecordings() {
  if(!db) await initDB();
  return new Promise(r => {
    const tx = db.transaction(STORE_REC,"readonly");
    const req = tx.objectStore(STORE_REC).getAll();
    req.onsuccess = () => r(req.result);
  });
}

async function getRecording(id) {
  if(!db) await initDB();
  return new Promise(r => {
    const tx = db.transaction(STORE_REC,"readonly");
    const req = tx.objectStore(STORE_REC).get(id);
    req.onsuccess = () => r(req.result);
  });
}

async function deleteRecording(id) {
  if(!db) await initDB();
  return new Promise(r => {
    const tx = db.transaction(STORE_REC,"readwrite");
    tx.objectStore(STORE_REC).delete(id);
    tx.oncomplete = r;
  });
}

// ─── MP3 конвертація ─────────────────────────────────────
async function convertToMp3(recId) {
  const rec = await getRecording(recId);
  if(!rec) return alert("Запис не знайдено");

  if(!ffmpeg.isLoaded()) {
    recStatus.textContent = "Завантаження FFmpeg... (перший раз може зайняти 10–30 с)";
    await ffmpeg.load();
  }

  try {
    recStatus.textContent = "Конвертація в MP3...";
    ffmpeg.FS("writeFile", "input.webm", await fetchFile(rec.blob));
    await ffmpeg.run("-i","input.webm","-vn","-acodec","libmp3lame","-q:a","2","output.mp3");
    const data = ffmpeg.FS("readFile","output.mp3");
    const mp3Blob = new Blob([data.buffer], {type:"audio/mp3"});

    const url = URL.createObjectURL(mp3Blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${rec.title.replace(/[^a-z0-9]/gi,"_")}.mp3`; a.click();
    URL.revokeObjectURL(url);

    recStatus.textContent = "MP3 завантажено!";
  } catch(e) {
    recStatus.textContent = "Помилка конвертації: "+e.message;
    console.error(e);
  }
}

// ─── Відтворення / скачування ────────────────────────────
window.playRec = async id => {
  const rec = await getRecording(id);
  if(!rec) return;
  const url = URL.createObjectURL(rec.blob);
  const audio = new Audio(url);
  audio.play().catch(e=>alert("Автозапуск заблоковано: "+e.message));
  // або використати <audio> елемент, якщо хочеш UI
  alert("Відтворення запущено (без UI в цій версії)");
};

window.downloadWebm = async id => {
  const rec = await getRecording(id);
  if(!rec) return;
  const url = URL.createObjectURL(rec.blob);
  const a = document.createElement("a");
  a.href=url; a.download=`${rec.title}.webm`; a.click();
};

// ─── Рендер записів + пошук ──────────────────────────────
async function loadRecordings(filter="") {
  const recs = await getAllRecordings();
  const cont = document.getElementById("recordingsList");
  cont.innerHTML = "";

  const lower = filter.toLowerCase();
  recs.filter(r => 
    r.title.toLowerCase().includes(lower)
  ).forEach(r => {
    const div = document.createElement("div");
    div.style.padding="10px"; div.style.background="#f1f3f5"; div.style.margin="8px 0"; div.style.borderRadius="8px";
    div.innerHTML = `
      <strong>${r.title}</strong> • ${new Date(r.created).toLocaleDateString("uk-UA")}<br>
      <button class="btn-primary small-btn" onclick="playRec(${r.id})">Відтворити</button>
      <button class="btn-secondary small-btn" onclick="downloadWebm(${r.id})">WebM</button>
      <button class="btn-success small-btn" onclick="convertToMp3(${r.id})">→ MP3</button>
      <button class="btn-danger small-btn" onclick="if(confirm('Видалити?')){deleteRecording(${r.id}).then(loadRecordings)}">×</button>
    `;
    cont.appendChild(div);
  });
}

// ─── Конспекти ───────────────────────────────────────────
function fillOutlineFromAudio() {
  document.getElementById("date").value = new Date().toISOString().split("T")[0];
  document.getElementById("theme").value = recTitleInp.value.trim() || "Проповідь";
  document.getElementById("preacher").value = "—";

  const notes = currentMarkers.map(m => 
    `${m.label}\n   ${m.note || "(додай нотатку)"}`
  ).join("\n\n");

  document.getElementById("notes").value = notes || "(маркерів не було)";
  alert("Маркери перенесено в нотатки!");
}

function saveOutline() {
  const o = {
    date: document.getElementById("date").value,
    theme: document.getElementById("theme").value.trim(),
    preacher: document.getElementById("preacher").value.trim(),
    notes: document.getElementById("notes").value.trim(),
    keyThought: document.getElementById("keyThought").value.trim(),
    created: Date.now()
  };
  if(!o.theme) return alert("Вкажіть тему");

  let arr = JSON.parse(localStorage.getItem(OUTLINES_KEY)||"[]");
  arr.unshift(o);
  localStorage.setItem(OUTLINES_KEY, JSON.stringify(arr));
  loadOutlines(); clearForm();
}

function loadOutlines(filter="") {
  const arr = JSON.parse(localStorage.getItem(OUTLINES_KEY)||"[]");
  const cont = document.getElementById("savedOutlines");
  cont.innerHTML = "";

  const lower = filter.toLowerCase();
  arr.filter(o => 
    o.theme.toLowerCase().includes(lower) ||
    o.notes.toLowerCase().includes(lower)
  ).forEach((o,i) => {
    const div = document.createElement("div");
    div.style.padding="12px"; div.style.background="#f1f3f5"; div.style.margin="8px 0"; div.style.borderRadius="8px";
    div.innerHTML = `
      <strong>${o.theme}</strong><br>
      <small>${o.date || "—"} • ${o.preacher || "—"}</small>
      <pre style="margin:8px 0; white-space:pre-wrap; font-size:0.9rem;">${o.notes.substring(0,200)}${o.notes.length>200?"...":""}</pre>
      <button class="btn-danger small-btn" onclick="if(confirm('Видалити?')){let a=JSON.parse(localStorage.getItem('${OUTLINES_KEY}'));a.splice(${i},1);localStorage.setItem('${OUTLINES_KEY}',JSON.stringify(a));loadOutlines()}">Видалити</button>
    `;
    cont.appendChild(div);
  });
}

function clearForm() {
  ["date","theme","preacher","notes","keyThought"].forEach(id=>document.getElementById(id).value="");
}

// ─── PDF експорт ─────────────────────────────────────────
document.getElementById("exportPdf").onclick = () => {
  const theme = document.getElementById("theme").value.trim() || "Конспект";
  const date = document.getElementById("date").value || new Date().toLocaleDateString("uk-UA");
  const preacher = document.getElementById("preacher").value.trim() || "—";
  const notes = document.getElementById("notes").value.trim().split("\n");
  const key = document.getElementById("keyThought").value.trim();

  const dd = {
    content: [
      {text: theme, style:"title"},
      {text: `Дата: ${date}   Проповідник: ${preacher}`, margin:[0,4], italics:true},
      notes.length && {text:"Нотатки", style:"header", margin:[0,16,0,4]},
      ...notes.map(l => ({text:l, margin:[0,0,0,2]})),
      key && {text:"Ключова думка", style:"header", margin:[0,20,0,4]},
      {text:key, italics:true}
    ],
    styles: {
      title: {fontSize:18, bold:true, alignment:"center", margin:[0,0,0,12]},
      header: {fontSize:14, bold:true, color:"#4a3b8c"}
    }
  };

  // Додаємо посилання на аудіо (текст)
  if(currentRecId) {
    dd.content.push({text: "\nАудіо-запис: " + (recTitleInp.value.trim() || "Запис проповіді"), margin:[0,16,0,4], color:"#555"});
    dd.content.push({text: "(відтворити в додатку за назвою)", italics:true, fontSize:10});
  }

  pdfMake.createPdf(dd).download(`конспект_${date || "без дати"}.pdf`);
};

// ─── Пошук ───────────────────────────────────────────────
document.getElementById("searchInput").oninput = e => {
  const val = e.target.value;
  loadRecordings(val);
  loadOutlines(val);
};

// ─── Ініціалізація ───────────────────────────────────────
initDB().then(() => {
  loadRecordings();
  loadOutlines();
});

startBtn.onclick = startRec;
stopBtn.onclick = stopRec;
document.getElementById("saveOutline").onclick = saveOutline;
document.getElementById("clearForm").onclick = clearForm;

recTitleInp.focus();
</script>
</body>
</html>
