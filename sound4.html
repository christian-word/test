<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Конспект + Аудіо-запис проповіді (оновлено)</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#f8f9fa; margin:0; padding:16px; }
    .container { max-width:720px; margin:0 auto; background:white; border-radius:12px; padding:20px; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
    h2, h3 { color:#2c3e50; }
    button { padding:10px 18px; margin:6px 4px; border:none; border-radius:8px; cursor:pointer; font-size:1rem; }
    .btn-primary   { background:#0d6efd; color:white; }
    .btn-danger    { background:#dc3545; color:white; }
    .btn-warning   { background:#ffc107; color:black; }
    .btn-secondary { background:#6c757d; color:white; }
    #timer { font-size:2.8rem; font-weight:bold; text-align:center; margin:20px 0; color:#343a40; }
    #status { text-align:center; color:#555; min-height:1.5em; margin:12px 0; }
    audio { width:100%; margin:16px 0; }
    .section { margin:24px 0; padding:16px; background:#f8f9fa; border-radius:10px; }
    .marker-item, .recording-item { padding:10px 14px; background:#e9ecef; margin:6px 0; border-radius:6px; }
    .recording-item { cursor: default; }
    .marker-item:hover { background:#dee2e6; }
    .recordings-list { margin-top:16px; }
    input, textarea { width:100%; padding:10px; margin:6px 0; border:1px solid #ced4da; border-radius:6px; box-sizing:border-box; }
    textarea { min-height:80px; }
    .small { font-size:0.9rem; padding:6px 12px; }
  </style>
</head>
<body>

<div class="container">

  <div id="recordSection" class="section">
    <h2>Запис проповіді</h2>
    
    <input type="text" id="recTitle" placeholder="Назва / тема / дата (наприклад: Іван 3:16 – 02.03.2026)">
    
    <div id="timer">00:00</div>
    
    <div style="text-align:center;">
      <button id="startRec" class="btn-primary">Почати запис</button>
      <button id="stopRec"  class="btn-danger" disabled>Зупинити</button>
      <button id="addMarker" class="btn-warning" disabled>Маркер</button>
    </div>
    
    <div id="recStatus">Готовий до запису…</div>
    
    <div id="currentMarkers" style="margin-top:16px;">
      <h3>Маркери поточного запису</h3>
      <div id="markersList"></div>
    </div>
  </div>

  <div id="playerSection" class="section" style="display:none;">
    <h3>Відтворення</h3>
    <audio id="audioPlayer" controls></audio>
    <div id="playerMarkers"></div>
  </div>

  <div class="section recordings-list">
    <h3>Збережені записи</h3>
    <div id="recordingsList"></div>
  </div>

  <div id="outlineSection" class="section">
    <h2>Конспект проповіді</h2>

    <label>Дата</label><input type="date" id="date">
    <label>Тема</label><input type="text" id="theme">
    <label>Проповідник / місце</label><input type="text" id="preacher">
    <label>Нотатки</label><textarea id="notes"></textarea>
    <label>Ключова думка</label><textarea id="keyThought"></textarea>

    <div style="margin:20px 0; text-align:center;">
      <button id="saveOutline" class="btn-primary">Зберегти конспект</button>
      <button id="clearForm" class="btn-secondary">Очистити форму</button>
    </div>

    <div id="outlineStatus" style="text-align:center; color:#555;"></div>
  </div>

  <div class="section">
    <h3>Збережені конспекти</h3>
    <div id="savedOutlines"></div>
  </div>

</div>

<script>
// IndexedDB
const DB_NAME = "SermonAudioDB";
const DB_VER  = 1;
const STORE   = "recordings";
let db;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) {
        d.createObjectStore(STORE, {keyPath: "id", autoIncrement: true});
      }
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = e => rej(e.target.error);
  });
}

async function saveRecording(title, blob, markers, durationSec) {
  if (!db) await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, "readwrite");
    const st = tx.objectStore(STORE);
    const entry = { title: title || new Date().toLocaleString("uk-UA"), blob, markers, durationSec, created: Date.now() };
    const r = st.add(entry);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}

async function getAllRecordings() {
  if (!db) await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, "readonly");
    const st = tx.objectStore(STORE);
    const r = st.getAll();
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}

async function getRecording(id) {
  if (!db) await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, "readonly");
    const st = tx.objectStore(STORE);
    const r = st.get(id);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}

async function deleteRecording(id) {
  if (!db) await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, "readwrite");
    const st = tx.objectStore(STORE);
    const r = st.delete(id);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}

// Інтерфейс
const startBtn     = document.getElementById("startRec");
const stopBtn      = document.getElementById("stopRec");
const markerBtn    = document.getElementById("addMarker");
const timerEl      = document.getElementById("timer");
const recStatus    = document.getElementById("recStatus");
const markersList  = document.getElementById("markersList");
const recTitleInp  = document.getElementById("recTitle");

let mediaRecorder = null;
let audioChunks = [];
let startTime = null;
let timerInt = null;
let currentMarkers = [];
let currentBlob = null;
let currentRecId = null;
let recordingStartMs = 0;

function formatTime(s) {
  const m = Math.floor(s/60).toString().padStart(2,"0");
  const sec = Math.floor(s%60).toString().padStart(2,"0");
  return `${m}:${sec}`;
}

function updateTimer() {
  if (!startTime) return;
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  timerEl.textContent = formatTime(elapsed);
}

function addMarker() {
  if (!startTime || !mediaRecorder || mediaRecorder.state !== "recording") return;
  const sec = Math.floor((Date.now() - startTime) / 1000);
  const lbl = `Маркер ${currentMarkers.length+1} — ${formatTime(sec)}`;
  currentMarkers.push({time: sec, label: lbl, note: ""});
  
  const div = document.createElement("div");
  div.className = "marker-item";
  div.textContent = lbl;
  markersList.appendChild(div);
  
  recStatus.textContent = `Додано ${lbl}`;
}

async function startRec() {
  if (mediaRecorder && mediaRecorder.state === "recording") return;

  try {
    recStatus.textContent = "Запит доступу до мікрофона...";
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    currentMarkers = [];
    markersList.innerHTML = "";
    startTime = Date.now();
    recordingStartMs = Date.now();

    mediaRecorder.ondataavailable = e => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      const durationSec = Math.floor((Date.now() - recordingStartMs) / 1000);
      currentBlob = new Blob(audioChunks, {type: "audio/webm"});
      const title = recTitleInp.value.trim() || new Date().toLocaleString("uk-UA");
      currentRecId = await saveRecording(title, currentBlob, currentMarkers, durationSec);

      recStatus.textContent = `Запис збережено (${formatTime(durationSec)}) → ${title}`;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      markerBtn.disabled = true;

      if (confirm(`Запис збережено (${formatTime(durationSec)}).\nСтворити конспект на основі маркерів?`)) {
        fillOutlineFromAudio(currentRecId, title, currentMarkers);
      }

      loadRecordings();
    };

    mediaRecorder.start();
    timerInt = setInterval(updateTimer, 333);
    
    startBtn.disabled = true;
    stopBtn.disabled = false;
    markerBtn.disabled = false;
    recStatus.textContent = "● Запис іде... Говоріть";
  } catch(e) {
    recStatus.textContent = "Помилка доступу до мікрофона:\n" + e.name + " — " + e.message;
  }
}

function stopRec() {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
    clearInterval(timerInt);
    timerEl.textContent = "00:00";
    startTime = null;
    recStatus.textContent = "Зупиняємо запис...";
  }
}

// Заповнення конспекту
function fillOutlineFromAudio(recId, title, markers) {
  document.getElementById("date").value = new Date().toISOString().split("T")[0];
  document.getElementById("theme").value = title;
  document.getElementById("preacher").value = "—";

  const notesText = markers.map(m =>
    `${m.label}\n    (тут нотатка – що сказав проповідник на ${formatTime(m.time)})`
  ).join("\n\n");

  document.getElementById("notes").value = notesText || "(маркерів не було)";
  document.getElementById("notes").dataset.audioId = recId;

  alert("Маркери перенесено в поле «Нотатки»!\nДоповни і збережи конспект.");
}

// Список записів
async function loadRecordings() {
  const recs = await getAllRecordings();
  const cont = document.getElementById("recordingsList");
  cont.innerHTML = recs.length ? "" : "<p style='color:#777;text-align:center;'>Записів немає</p>";

  recs.forEach(r => {
    const dur = r.durationSec ? formatTime(r.durationSec) : "—";
    const div = document.createElement("div");
    div.className = "recording-item";
    div.innerHTML = `
      <strong>${r.title}</strong><br>
      <small>${new Date(r.created).toLocaleString("uk-UA")} • ${dur}</small>
      <div style="margin-top:8px;">
        <button class="btn-primary small" onclick="playRecording(${r.id})">Відтворити</button>
        <button class="btn-secondary small" onclick="downloadRecording(${r.id})">Скачати</button>
        <button class="btn-danger small" onclick="delRecording(${r.id})">×</button>
      </div>`;
    cont.appendChild(div);
  });
}

window.playRecording = async id => {
  const rec = await getRecording(id);
  if (!rec) return;
  const url = URL.createObjectURL(rec.blob);
  const player = document.getElementById("audioPlayer");
  player.src = url;
  document.getElementById("playerSection").style.display = "block";

  const mCont = document.getElementById("playerMarkers");
  mCont.innerHTML = "<h4>Маркери</h4>";
  (rec.markers||[]).forEach(m => {
    const el = document.createElement("div");
    el.className = "marker-item";
    el.textContent = m.label;
    el.onclick = () => { player.currentTime = m.time; player.play().catch(()=>{}); };
    mCont.appendChild(el);
  });

  player.play().catch(() => recStatus.textContent = "Автозапуск заблоковано — натисніть play вручну");
};

window.downloadRecording = async id => {
  const rec = await getRecording(id);
  if (!rec) return;
  const url = URL.createObjectURL(rec.blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${rec.title.replace(/[^a-z0-9]/gi,"_")}.webm`;
  a.click();
  URL.revokeObjectURL(url);
};

window.delRecording = async id => {
  if (!confirm("Видалити запис?")) return;
  await deleteRecording(id);
  loadRecordings();
};

// Конспекти — залишаємо як було (можемо покращити пізніше)
const OUTLINES_KEY = "sermonOutlines2026";

function saveOutline() {
  const data = {
    date: document.getElementById("date").value,
    theme: document.getElementById("theme").value.trim(),
    preacher: document.getElementById("preacher").value.trim(),
    notes: document.getElementById("notes").value.trim(),
    keyThought: document.getElementById("keyThought").value.trim(),
    audioId: document.getElementById("notes").dataset.audioId || null,
    created: Date.now()
  };

  if (!data.theme) return alert("Вкажіть тему");

  let arr = JSON.parse(localStorage.getItem(OUTLINES_KEY)||"[]");
  arr.unshift(data);
  localStorage.setItem(OUTLINES_KEY, JSON.stringify(arr));
  renderOutlines();
  clearOutlineForm();
}

function renderOutlines() {
  const cont = document.getElementById("savedOutlines");
  const arr = JSON.parse(localStorage.getItem(OUTLINES_KEY)||"[]");
  cont.innerHTML = arr.length ? "" : "<p style='color:#777;text-align:center;'>Конспектів немає</p>";

  arr.forEach((o,i) => {
    const div = document.createElement("div");
    div.style.padding = "12px";
    div.style.background = "#f1f3f5";
    div.style.margin = "8px 0";
    div.style.borderRadius = "8px";
    div.innerHTML = `
      <strong>${o.theme}</strong><br>
      <small>${o.date || "—"} • ${o.preacher || "—"}</small>
      ${o.audioId ? `<br><button class="btn-primary small" onclick="playRecording(${o.audioId})">▶ Аудіо</button>` : ""}
      <pre style="white-space:pre-wrap;margin-top:8px;">${o.notes.substring(0,180)}${o.notes.length>180?"...":""}</pre>
      <button class="btn-danger small" onclick="deleteOutline(${i})">Видалити</button>`;
    cont.appendChild(div);
  });
}

window.deleteOutline = i => {
  if (!confirm("Видалити конспект?")) return;
  let arr = JSON.parse(localStorage.getItem(OUTLINES_KEY)||"[]");
  arr.splice(i,1);
  localStorage.setItem(OUTLINES_KEY, JSON.stringify(arr));
  renderOutlines();
};

function clearOutlineForm() {
  ["date","theme","preacher","notes","keyThought"].forEach(id => document.getElementById(id).value = "");
  delete document.getElementById("notes").dataset.audioId;
}

// Ініціалізація
openDB().then(loadRecordings);
renderOutlines();

startBtn.onclick   = startRec;
stopBtn.onclick    = stopRec;
markerBtn.onclick  = addMarker;
document.getElementById("saveOutline").onclick = saveOutline;
document.getElementById("clearForm").onclick = clearOutlineForm;

recTitleInp.focus();
</script>
</body>
</html>
