<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>YouTube Subtitles Extractor</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        textarea { width: 100%; height: 300px; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Извлечь субтитры из YouTube</h2>
    <input type="text" id="videoUrl" placeholder="Вставьте ссылку на видео (например, https://www.youtube.com/watch?v=...)">
    <button onclick="extractSubs()">Получить текст</button>
    <textarea id="output" placeholder="Текст субтитров появится здесь..." readonly></textarea>

    <script>
async function extractSubs() {
    const urlInput = document.getElementById('videoUrl').value;
    const output = document.getElementById('output');
    output.value = "Загрузка...";

    // Извлекаем ID видео
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = urlInput.match(regExp);
    const videoId = (match && match[2].length == 11) ? match[2] : null;

    if (!videoId) {
        output.value = "Ошибка: Неверная ссылка на YouTube видео.";
        return;
    }

    try {
        // Переключаемся на более стабильный общественный прокси
        const proxyUrl = 'https://corsproxy.io/?';
        const targetUrl = `https://www.youtube.com/watch?v=${videoId}`;
        
        const response = await fetch(`${proxyUrl}${encodeURIComponent(targetUrl)}`);
        if (!response.ok) throw new Error("Не удалось загрузить страницу YouTube через прокси");
        
        const html = await response.text();

        // Ищем строку с данными о субтитрах в коде страницы
        const regex = /"captionTracks":\s*(\[[^\]]+\])/;
        const parsed = html.match(regex);

        if (!parsed) {
            output.value = "Субтитры не найдены или отключены для этого видео.";
            return;
        }

        const captionTracks = JSON.parse(parsed[1]);
        const subUrl = captionTracks[0].baseUrl; // Первый доступный язык

        // Загружаем XML-файл с субтитрами через тот же прокси
        const subResponse = await fetch(`${proxyUrl}${encodeURIComponent(subUrl)}`);
        const xmlText = await subResponse.text();
        
        // Очищаем XML от тегов
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const textNodes = xmlDoc.getElementsByTagName("text");
        
        if (textNodes.length === 0) {
            output.value = "Файл субтитров пуст или имеет неверный формат.";
            return;
        }

        let result = Array.from(textNodes).map(node => {
            // Декодируем HTML-сущности (например, &amp; -> &)
            const txt = document.createElement("textarea");
            txt.innerHTML = node.textContent;
            return txt.value;
        }).join("\n");

        output.value = result;

    } catch (error) {
        output.value = "Произошла ошибка при получении данных через прокси: " + error.message + 
                       "\n\nПопробуйте подождать пару минут или использовать другое видео.";
    }
}
    </script>
</body>
</html>
