<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sacred Stream | Поиск Христианской Музыки</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-purple: #a78bfa;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px 50px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .controls-section {
            width: 100%;
            max-width: 900px;
            margin-bottom: 25px;
        }

        .search-bar-wrapper {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 20px;
            display: flex;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: border-color 0.3s;
            margin-bottom: 15px;
        }

        .search-bar-wrapper:focus-within {
            border-color: var(--accent-blue);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            padding: 14px 20px;
            font-size: 1.05rem;
            font-family: inherit;
        }

        .search-input::placeholder {
            color: var(--text-dim);
        }

        .main-search-btn {
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }

        .main-search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.4);
        }

        /* Фильтры сайтов */
        .filters-section {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .filters-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .filters-title {
            font-weight: 600;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toggle-all-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .toggle-all-btn:hover {
            background: var(--accent-blue);
            color: var(--bg-dark);
        }

        .sites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
        }

        .site-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .site-checkbox:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent-blue);
        }

        .site-checkbox.active {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--accent-green);
        }

        .site-checkbox input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent-green);
        }

        .site-info {
            flex: 1;
        }

        .site-name {
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .site-url {
            font-size: 0.8rem;
            color: var(--text-dim);
            font-family: monospace;
        }

        .site-badge {
            background: var(--accent-purple);
            color: white;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Статистика */
        .stats-bar {
            display: flex;
            gap: 15px;
            justify-content: center;
            padding: 12px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .stat-value {
            color: var(--accent-blue);
            font-weight: 700;
        }

        .quick-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 12px;
        }

        .tag-btn {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-dim);
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            font-weight: 500;
        }

        .tag-btn:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .utility-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .utility-btn {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-dim);
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            font-weight: 500;
        }

        .utility-btn:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        #results-area {
            width: 100%;
            max-width: 950px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            min-height: 200px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .gsc-control-cse { 
            padding: 20px !important;
            background: transparent !important;
            border: none !important;
        }

        /* Модальное окно истории */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 70vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }

        .history-item {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:hover {
            background: rgba(56, 189, 248, 0.2);
            transform: translateX(5px);
        }

        .history-query {
            color: var(--text-main);
            font-weight: 500;
        }

        .history-time {
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        .empty-state {
            text-align: center;
            color: var(--text-dim);
            padding: 40px 20px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .search-bar-wrapper {
                flex-direction: column;
            }

            .main-search-btn {
                width: 100%;
            }

            .sites-grid {
                grid-template-columns: 1fr;
            }

            .filters-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Sacred Stream</h1>
        <p class="subtitle">Поиск христианской музыки</p>
    </header>

    <div class="controls-section">
        <!-- Фильтры сайтов -->
        <div class="filters-section">
            <div class="filters-header">
                <div class="filters-title">
                    <i class="fa-solid fa-filter"></i>
                    Искать на сайтах:
                </div>
                <button class="toggle-all-btn" onclick="toggleAll()">
                    <i class="fa-solid fa-list-check"></i> Все / Нет
                </button>
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <i class="fa-solid fa-globe"></i>
                    Выбрано: <span class="stat-value" id="activeCount">3</span> из <span class="stat-value">3</span>
                </div>
            </div>

            <div class="sites-grid" id="sitesGrid"></div>
        </div>

        <div class="search-bar-wrapper">
            <input 
                type="text" 
                id="userInput" 
                class="search-input" 
                placeholder="Введите название песни, исполнителя или альбома..." 
                autofocus
            >
            <button class="main-search-btn" onclick="handleSearch()">
                <i class="fa-solid fa-magnifying-glass"></i> Найти
            </button>
        </div>
        
        <div class="quick-tags">
            <button class="tag-btn" onclick="quickSearch('worship')">
                <i class="fa-solid fa-hands-praying"></i> Worship
            </button>
            <button class="tag-btn" onclick="quickSearch('минусовка')">
                <i class="fa-solid fa-volume-xmark"></i> Минус
            </button>
            <button class="tag-btn" onclick="quickSearch('инструментальная')">
                <i class="fa-solid fa-music"></i> Инструментал
            </button>
            <button class="tag-btn" onclick="quickSearch('хвала поклонение')">
                <i class="fa-solid fa-dove"></i> Хвала
            </button>
            <button class="tag-btn" onclick="quickSearch('gospel')">
                <i class="fa-solid fa-cross"></i> Gospel
            </button>
            <button class="tag-btn" onclick="quickSearch('акапелла')">
                <i class="fa-solid fa-microphone"></i> Акапелла
            </button>
            <button class="tag-btn" onclick="quickSearch('детские песни')">
                <i class="fa-solid fa-child"></i> Детские
            </button>
            <button class="tag-btn" onclick="quickSearch('рождество')">
                <i class="fa-solid fa-star"></i> Рождество
            </button>
        </div>

        <div class="utility-bar">
            <button class="utility-btn" onclick="showHistory()">
                <i class="fa-solid fa-clock-rotate-left"></i>
                История
            </button>
            <button class="utility-btn" onclick="clearSearch()">
                <i class="fa-solid fa-broom"></i>
                Очистить
            </button>
            <label class="utility-btn" style="cursor: pointer;">
                <input type="checkbox" id="ai-toggle" onchange="toggleAI(this.checked)" style="margin-right: 8px; cursor: pointer;">
                <i class="fa-solid fa-robot"></i>
                AI Анализатор
            </label>
        </div>
    </div>

    <div id="results-area">
        <div class="gcse-searchresults-only"></div>
    </div>

    <!-- Модальное окно истории -->
    <div class="modal" id="historyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">История поиска</h2>
                <button class="close-btn" onclick="closeHistory()">&times;</button>
            </div>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        // База данных сайтов
        const sites = [
            {
                id: 'holychords',
                name: 'Holy Chords',
                url: 'holychords.pro',
                type: 'Аккорды',
                active: true
            },
            {
                id: 'kgmusic',
                name: 'KG Music',
                url: 'kg-music.club',
                type: 'Музыка',
                active: true
            },
            {
                id: 'fonki',
                name: 'Fonki',
                url: 'fonki.pro',
                type: 'Фонограммы',
                active: true
            }
        ];

        // История поиска
        let searchHistory = JSON.parse(localStorage.getItem('searchHistory') || '[]');

        // Загружаем сохраненное состояние фильтров
        function loadSitesState() {
            const saved = localStorage.getItem('sitesState');
            if (saved) {
                const state = JSON.parse(saved);
                sites.forEach(site => {
                    const savedSite = state.find(s => s.id === site.id);
                    if (savedSite) {
                        site.active = savedSite.active;
                    }
                });
            }
        }

        // Сохраняем состояние фильтров
        function saveSitesState() {
            const state = sites.map(s => ({ id: s.id, active: s.active }));
            localStorage.setItem('sitesState', JSON.stringify(state));
        }

        // Рендерим чекбоксы сайтов
        function renderSites() {
            const grid = document.getElementById('sitesGrid');
            grid.innerHTML = sites.map(site => `
                <div class="site-checkbox ${site.active ? 'active' : ''}" onclick="toggleSite('${site.id}')">
                    <input type="checkbox" ${site.active ? 'checked' : ''} onchange="toggleSite('${site.id}')" onclick="event.stopPropagation()">
                    <div class="site-info">
                        <div class="site-name">${site.name}</div>
                        <div class="site-url">${site.url}</div>
                    </div>
                    <span class="site-badge">${site.type}</span>
                </div>
            `).join('');
            updateStats();
        }

        // Переключение сайта
        function toggleSite(id, fromCheckbox = false) {
            const site = sites.find(s => s.id === id);
            if (site) {
                site.active = !site.active;
                saveSitesState();
                renderSites();
            }
        }

        // Все/Нет
        function toggleAll() {
            const allActive = sites.every(s => s.active);
            sites.forEach(s => s.active = !allActive);
            saveSitesState();
            renderSites();
        }

        // Обновление статистики
        function updateStats() {
            const activeCount = sites.filter(s => s.active).length;
            document.getElementById('activeCount').textContent = activeCount;
        }

        // Формирование поискового запроса
        function buildSearchQuery(userQuery) {
            const activeSites = sites.filter(s => s.active);
            
            if (activeSites.length === 0) {
                alert('⚠️ Выберите хотя бы один сайт для поиска!');
                return null;
            }

            if (activeSites.length === sites.length) {
                // Все сайты активны - ищем везде
                return userQuery;
            }

            // Формируем запрос с site: операторами
            const siteQuery = activeSites.map(s => `site:${s.url}`).join(' OR ');
            return `${userQuery} (${siteQuery})`;
        }

        function handleSearch() {
            const userQuery = document.getElementById('userInput').value.trim();
            if (!userQuery) return;

            const finalQuery = buildSearchQuery(userQuery);
            if (!finalQuery) return;

            // Отправляем финальный запрос напрямую в Google CSE
            executeGoogleSearch(finalQuery);
            
            saveToHistory(userQuery, sites.filter(s => s.active).map(s => s.name));
        }

        function executeGoogleSearch(searchQuery) {
            try {
                const element = google.search.cse.element.getElement('results-only0');
                if (element) {
                    // Выполняем поиск БЕЗ изменения input поля
                    element.execute(searchQuery);
                } else {
                    throw new Error("CSE not ready");
                }
            } catch (e) {
                // Fallback через hash
                const currentInput = document.getElementById('userInput').value;
                window.location.hash = 'gsc.q=' + encodeURIComponent(searchQuery);
                // Restore input after hash change
                setTimeout(() => {
                    document.getElementById('userInput').value = currentInput;
                }, 50);
            }

            // Если AI включён - запускаем анализ
            if (aiEnabled && aiAnalyzer) {
                aiAnalyzer.analyzeSearchResults(searchQuery);
            }
        }

        function quickSearch(tag) {
            document.getElementById('userInput').value = tag;
            const finalQuery = buildSearchQuery(tag);
            if (!finalQuery) return;
            
            executeGoogleSearch(finalQuery);
            saveToHistory(tag, sites.filter(s => s.active).map(s => s.name));
        }

        function saveToHistory(query, activeSites) {
            searchHistory = searchHistory.filter(item => item.query !== query);
            
            searchHistory.unshift({
                query: query,
                sites: activeSites,
                timestamp: new Date().toISOString()
            });

            searchHistory = searchHistory.slice(0, 20);
            localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
        }

        function showHistory() {
            const modal = document.getElementById('historyModal');
            const list = document.getElementById('historyList');

            if (searchHistory.length === 0) {
                list.innerHTML = '<div class="empty-state"><i class="fa-solid fa-inbox" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.3;"></i><p>История поиска пуста</p></div>';
            } else {
                list.innerHTML = searchHistory.map(item => {
                    const date = new Date(item.timestamp);
                    const timeStr = date.toLocaleDateString('ru-RU', { 
                        day: 'numeric', 
                        month: 'short',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    const sitesStr = item.sites ? `<br><small style="color: var(--text-dim);">${item.sites.join(', ')}</small>` : '';

                    return `
                        <div class="history-item" onclick="searchFromHistory('${item.query.replace(/'/g, "\\'")}')">
                            <div>
                                <span class="history-query">${item.query}</span>
                                ${sitesStr}
                            </div>
                            <span class="history-time">${timeStr}</span>
                        </div>
                    `;
                }).join('');
            }

            modal.classList.add('show');
        }

        function closeHistory() {
            document.getElementById('historyModal').classList.remove('show');
        }

        function searchFromHistory(query) {
            document.getElementById('userInput').value = query;
            closeHistory();
            
            const finalQuery = buildSearchQuery(query);
            if (!finalQuery) return;
            
            executeGoogleSearch(finalQuery);
        }

        function clearSearch() {
            document.getElementById('userInput').value = '';
            document.getElementById('userInput').focus();
        }

        // Закрытие модалки
        document.getElementById('historyModal').addEventListener('click', (e) => {
            if (e.target.id === 'historyModal') {
                closeHistory();
            }
        });

        // Enter для поиска
        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        // Инициализация
        loadSitesState();
        renderSites();

        // === AI МОДУЛЬ ===
        let aiAnalyzer = null;
        let aiEnabled = localStorage.getItem('aiEnabled') === 'true';

        // Восстанавливаем состояние чекбокса
        if (aiEnabled) {
            document.getElementById('ai-toggle').checked = true;
            initAI();
        }

        function toggleAI(enabled) {
            aiEnabled = enabled;
            localStorage.setItem('aiEnabled', enabled);

            if (enabled) {
                initAI();
            } else {
                aiAnalyzer = null;
                const container = document.getElementById('ai-analysis-container');
                if (container) container.remove();
            }
        }

        function initAI() {
            if (!aiAnalyzer) {
                aiAnalyzer = new AIAnalyzer({
                    apiKey: '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',
                    apiUrl: 'https://api.groq.com/openai/v1/chat/completions',
                    modelName: 'meta-llama/llama-4-maverick-17b-128e-instruct'
                });
                window.aiAnalyzer = aiAnalyzer; // для кнопки "обновить"
            }
        }

        // Автопоиск при загрузке
        window.addEventListener('load', () => {
            const hash = window.location.hash;
            if (hash.includes('gsc.q=')) {
                const query = decodeURIComponent(hash.split('gsc.q=')[1]);
                document.getElementById('userInput').value = query;
            }
        });
    </script>

    <script async src="https://cse.google.com/cse.js?cx=d454e3c095f214e80"></script>
    <script async src="">ai_analyzer_module.js</script>

 
</body>
</html>
