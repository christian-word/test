<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 2.5 - Voice & Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root { --bg: #111; --card: #1e1e1e; --accent: #3b82f6; --text: #eee; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        header { padding: 15px 20px; background: var(--card); border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        .msg { padding: 12px 18px; border-radius: 18px; max-width: 80%; line-height: 1.6; font-size: 15px; }
        .user-msg { background: var(--accent); align-self: flex-end; }
        .ai-msg { background: var(--card); align-self: flex-start; border: 1px solid #333; }
        
        pre { background: #000 !important; padding: 12px; border-radius: 10px; overflow-x: auto; border: 1px solid #444; }
        
        .controls { background: var(--card); padding: 20px; border-top: 1px solid #333; }
        .inner { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        
        .input-row { display: flex; gap: 10px; align-items: flex-end; }
        textarea { flex: 1; background: #0b0b0b; color: #fff; border: 1px solid #444; border-radius: 12px; padding: 12px; outline: none; resize: none; font-size: 15px; }
        
        .btn { border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-send { background: var(--accent); color: #fff; padding: 12px 20px; }
        .btn-tool { background: #333; color: #fff; width: 45px; height: 45px; font-size: 20px; }
        .btn-tool.active { background: #ef4444; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        #img-preview { display: none; margin-bottom: 10px; border: 2px solid var(--accent); border-radius: 8px; max-height: 100px; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; letter-spacing: 1px;">GEMINI 2.5 SMART</div>
    <button onclick="clearHistory()" class="btn" style="background:#444; padding: 5px 10px; font-size: 12px; color: #ccc;">Сброс</button>
</header>

<div id="chat-container"></div>

<div class="controls">
    <div class="inner">
        <img id="img-preview" src="">
        
        <div class="input-row">
            <button onclick="document.getElementById('file-in').click()" class="btn btn-tool" title="Прикрепить фото">📎</button>
            <input type="file" id="file-in" accept="image/*" style="display:none">
            
            <button id="voice-btn" class="btn btn-tool" title="Голосовой ввод">🎤</button>
            
            <textarea id="prompt-in" rows="1" placeholder="Напишите что-нибудь..."></textarea>
            
            <button id="send-btn" class="btn btn-send">➔</button>
        </div>
    </div>
</div>

<script>
    const KEY = 'AIzaSyB6q-cambUWP6Q_BsiHyCd8Fs8w42ME2sk';
    const URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${KEY}`;

    let history = [];
    let base64Img = null;

    // Настройка голоса
    const voiceBtn = document.getElementById('voice-btn');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'ru-RU';
        recognition.interimResults = false;

        voiceBtn.onclick = () => {
            recognition.start();
            voiceBtn.classList.add('active');
        };

        recognition.onresult = (event) => {
            const result = event.results[0][0].transcript;
            document.getElementById('prompt-in').value = result;
            voiceBtn.classList.remove('active');
        };

        recognition.onerror = () => voiceBtn.classList.remove('active');
        recognition.onend = () => voiceBtn.classList.remove('active');
    } else {
        voiceBtn.style.display = 'none';
    }

    // Работа с фото
    document.getElementById('file-in').onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (ev) => {
            base64Img = ev.target.result.split(',')[1];
            const p = document.getElementById('img-preview');
            p.src = ev.target.result;
            p.style.display = 'block';
        };
        reader.readAsDataURL(file);
    };

    async function send() {
        const input = document.getElementById('prompt-in');
        const text = input.value.trim();
        if (!text && !base64Img) return;

        const btn = document.getElementById('send-btn');
        btn.disabled = true;

        addBubble('user', text || "[Изображение]");
        
        const parts = [];
        if (text) parts.push({ text: text });
        if (base64Img) parts.push({ inline_data: { mime_type: "image/jpeg", data: base64Img } });

        history.push({ role: "user", parts: parts });
        
        input.value = '';
        base64Img = null;
        document.getElementById('img-preview').style.display = 'none';

        const aiBubble = addBubble('ai', "...");

        try {
            const res = await fetch(URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    contents: history,
                    system_instruction: { parts: [{ text: "Ты — умный и дружелюбный помощник. Отвечай лаконично, по существу, поддерживай нормальный человеческий диалог." }] }
                })
            });

            const data = await res.json();
            const reply = data.candidates[0].content.parts[0].text;
            
            aiBubble.innerHTML = marked.parse(reply);
            history.push({ role: "model", parts: [{ text: reply }] });
            aiBubble.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));

        } catch (err) {
            aiBubble.innerText = "Ошибка: " + err.message;
        } finally {
            btn.disabled = false;
            document.getElementById('chat-container').scrollTop = document.getElementById('chat-container').scrollHeight;
        }
    }

    function addBubble(role, content) {
        const cont = document.getElementById('chat-container');
        const d = document.createElement('div');
        d.className = `msg ${role}-msg`;
        d.innerHTML = role === 'ai' ? content : marked.parse(content);
        cont.appendChild(d);
        cont.scrollTop = cont.scrollHeight;
        return d;
    }

    function clearHistory() {
        history = [];
        document.getElementById('chat-container').innerHTML = '';
    }

    document.getElementById('send-btn').onclick = send;
    document.getElementById('prompt-in').onkeydown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    };
</script>

</body>
</html>
