<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Извлечение, вывод и скачивание данных из Google Таблицы</title>
    <style>
        /* Стиль для HTML-таблицы */
        table, th, td {
            border: 1px solid #ccc;
            border-collapse: collapse;
            padding: 8px;
            font-family: Arial, sans-serif;
        }
        th {
            background-color: #f0f0f0;
        }
        /* Стиль для кнопки */
        #download-btn {
            margin-bottom: 20px;
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none; /* Скрываем кнопку до загрузки данных */
        }
        #data-output {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Данные из Google Таблицы:</h1>
    
    <button id="download-btn">⬇️ Скачать данные (CSV)</button> 
    
    <div id="data-output">Загрузка данных...</div> 
    
    <script>
        // --- КОНСТАНТЫ ---
        
        // ID первого листа таблицы
        const SHEET_GID = "0"; 
        
        // Прямая ссылка на экспорт CSV вашей Таблицы
        const GOOGLE_SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/1_Gt1IGItFQI1DGg8iwONlcbTe8LQ7O9nPoZYdmHh8Cc/gviz/tq?tqx=out:csv&gid=${SHEET_GID}`;

        // --- ФУНКЦИИ ОБРАБОТКИ ДАННЫХ ---

        // 1. Преобразование CSV-текста в массив объектов
        function parseCsv(csvText) {
            const lines = csvText.trim().split('\n');
            
            // Заголовки таблицы (первая строка)
            const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
            
            // Преобразование оставшихся строк в массив объектов
            const dataArray = lines.slice(1).map(line => {
                const values = line.split(',');
                let obj = {};
                headers.forEach((header, i) => {
                    // Очистка от лишних кавычек и пробелов
                    obj[header] = values[i] ? values[i].trim().replace(/"/g, '') : '';
                });
                return obj;
            });
            return { headers, data: dataArray };
        }
        
        // 2. Преобразование массива объектов обратно в CSV-текст
        function convertToCSV(dataObject) {
            const headers = dataObject.headers;
            const data = dataObject.data;

            // Формируем строку заголовков
            let csv = headers.join(',') + '\n';

            // Формируем строки данных
            data.forEach(row => {
                let rowArray = headers.map(header => {
                    // Оборачиваем значения в кавычки на случай, если они содержат запятые
                    let value = row[header] === undefined || row[header] === null ? '' : String(row[header]);
                    return `"${value.replace(/"/g, '""')}"`;
                });
                csv += rowArray.join(',') + '\n';
            });

            return csv;
        }

        // --- ФУНКЦИИ ВЫВОДА И СКАЧИВАНИЯ ---

        // 3. Вывод данных на страницу (создание HTML-таблицы)
        function displayData(dataObject) {
            const container = document.getElementById('data-output');
            
            if (!dataObject.data || dataObject.data.length === 0) {
                container.innerHTML = 'Нет данных для отображения.';
                return;
            }

            const table = document.createElement('table');
            const thead = table.createTHead();
            const headerRow = thead.insertRow();
            
            // Создание заголовков (<th>)
            dataObject.headers.forEach(headerText => {
                const th = document.createElement('th');
                th.textContent = headerText;
                headerRow.appendChild(th);
            });

            // Создание строк данных (<td>)
            const tbody = table.createTBody();
            dataObject.data.forEach(rowData => {
                const row = tbody.insertRow();
                dataObject.headers.forEach(header => {
                    const cell = row.insertCell();
                    cell.textContent = rowData[header];
                });
            });

            container.innerHTML = ''; 
            container.appendChild(table);
        }

        // 4. Запуск скачивания файла CSV (с исправлением кодировки UTF-8 BOM)
        function downloadCSV(dataObject) {
            const csvData = convertToCSV(dataObject);
            const filename = 'google_sheet_export.csv';
            
            // Добавляем BOM (Byte Order Mark) для принудительной кодировки UTF-8 в Excel
            const BOM = '\uFEFF'; 
            const finalCsvData = BOM + csvData;
            
            // Создаем Blob, явно указывая кодировку UTF-8
            const blob = new Blob([finalCsvData], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);

            // Создаем временную ссылку и запускаем клик
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link); 
        }

        // --- ГЛАВНАЯ ФУНКЦИЯ ---

        async function fetchAndDisplayData() {
            const outputContainer = document.getElementById('data-output');
            const downloadBtn = document.getElementById('download-btn');

            try {
                const response = await fetch(GOOGLE_SHEET_CSV_URL);
                
                if (!response.ok) {
                    throw new Error(`Ошибка HTTP: ${response.status}`);
                }

                const csvText = await response.text();
                const parsedData = parseCsv(csvText);
                
                // Шаг 1: Вывод данных на страницу
                displayData(parsedData); 
                
                // Шаг 2: Активация кнопки скачивания
                downloadBtn.style.display = 'block'; 
                downloadBtn.onclick = () => downloadCSV(parsedData);
                
            } catch (error) {
                console.error("Не удалось получить данные:", error);
                outputContainer.innerHTML = `Ошибка загрузки данных: ${error.message}. Убедитесь, что вы запустили код через локальный веб-сервер.`;
                downloadBtn.style.display = 'none';
            }
        }

        // Запускаем процесс при загрузке страницы
        fetchAndDisplayData();
    </script>
</body>
</html>
