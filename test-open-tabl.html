<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Извлечение, вывод и скачивание данных</title>
    <style>
        /* Добавим минимальное форматирование для таблицы */
        table, th, td {
            border: 1px solid #ccc;
            border-collapse: collapse;
            padding: 8px;
        }
        th {
            background-color: #f0f0f0;
        }
        #download-btn {
            margin-bottom: 20px;
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none; /* Скрываем кнопку до загрузки данных */
        }
    </style>
</head>
<body>

    <h1>Данные из Google Таблицы:</h1>
    
    <button id="download-btn">⬇️ Скачать данные (CSV)</button> 
    
    <div id="data-output">Загрузка данных...</div> 
    
    <script>
        // Идентификатор первого листа таблицы
        const SHEET_GID = "0"; 
        
        // Ваша прямая ссылка на экспорт CSV
        const GOOGLE_SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/1_Gt1IGItFQI1DGg8iwONlcbTe8LQ7O9nPoZYdmHh8Cc/gviz/tq?tqx=out:csv&gid=${SHEET_GID}`;

        // --- Вспомогательные функции ---

        // 1. Преобразование массива объектов в CSV-текст
        function convertToCSV(dataObject) {
            const headers = dataObject.headers;
            const data = dataObject.data;

            // Формируем строку заголовков
            let csv = headers.join(',') + '\n';

            // Формируем строки данных
            data.forEach(row => {
                let rowArray = headers.map(header => {
                    // Оборачиваем значения в кавычки на случай, если они содержат запятые
                    let value = row[header] === undefined || row[header] === null ? '' : String(row[header]);
                    return `"${value.replace(/"/g, '""')}"`;
                });
                csv += rowArray.join(',') + '\n';
            });

            return csv;
        }
        
        // 2. Запуск скачивания файла CSV
        function downloadCSV(dataObject) {
            const csvData = convertToCSV(dataObject);
            const filename = 'google_sheet_export.csv';
            
            // Создаем Data URI
            const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);

            // Создаем временную ссылку и запускаем клик
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link); // Удаляем временную ссылку
        }
        
        // 3. Вывод данных на страницу (предыдущая функция)
        function displayData(dataObject) {
            const container = document.getElementById('data-output');
            
            // ... (предыдущий код для создания HTML-таблицы) ...
            
            // Пропускаем создание таблицы, чтобы не занимать место,
            // предполагаем, что вы уже успешно используете этот код
            
            // ... (Код создания table, thead, tbody и вставки в container)
            
            // --- Здесь ваша логика создания и вставки таблицы ---
            
            // Пример: если таблица успешно создана
            // container.appendChild(table); 
            container.innerHTML = 'Таблица успешно загружена. Смотрите в консоли или реализуйте вывод.';
        }
        
        // 4. Главная функция для получения и отображения данных
        async function fetchAndDisplayData() {
            try {
                const response = await fetch(GOOGLE_SHEET_CSV_URL);
                
                if (!response.ok) {
                    throw new Error(`Ошибка HTTP: ${response.status}`);
                }

                const csvText = await response.text();
                
                // Парсинг данных
                const parsedData = parseCsv(csvText);
                
                // Вывод данных на страницу
                // displayData(parsedData); // Отображение таблицы
                
                // 💥 Активация кнопки скачивания
                const downloadBtn = document.getElementById('download-btn');
                downloadBtn.style.display = 'block'; // Показываем кнопку
                
                // Привязываем функцию скачивания к кнопке
                downloadBtn.onclick = () => downloadCSV(parsedData);
                
                // В консоли для наглядности (если не отображаете на странице)
                console.log("Данные загружены. Кнопка 'Скачать' активирована.");
                
            } catch (error) {
                console.error("Не удалось получить данные:", error);
                document.getElementById('data-output').innerHTML = `Ошибка загрузки данных: ${error.message}`;
            }
        }
        
        // Функция парсинга CSV (из предыдущего ответа)
        function parseCsv(csvText) {
            const lines = csvText.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
            
            const dataArray = lines.slice(1).map(line => {
                const values = line.split(',');
                let obj = {};
                headers.forEach((header, i) => {
                    obj[header] = values[i] ? values[i].trim().replace(/"/g, '') : '';
                });
                return obj;
            });
            return { headers, data: dataArray };
        }

        // Запускаем процесс
        fetchAndDisplayData();
    </script>
</body>
</html>
