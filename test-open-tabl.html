<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Извлечение данных из Google Таблиц</title>
</head>
<body>

    <h1>Данные извлечены в консоль браузера (F12)</h1>
    
    <script>
        // 1. Указываем прямую ссылку на экспорт CSV
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1_Gt1IGItFQI1DGg8iwONlcbTe8LQ7O9nPoZYdmHh8Cc/gviz/tq?tqx=out:csv&gid=0";

        // 2. Функция для извлечения данных
        async function fetchSheetData() {
            try {
                // Выполняем HTTP-запрос
                const response = await fetch(GOOGLE_SHEET_CSV_URL);
                
                if (!response.ok) {
                    throw new Error(`Ошибка HTTP: ${response.status}`);
                }

                // Читаем тело ответа как текст (в формате CSV)
                const csvText = await response.text();

                // Выводим сырой текст CSV в консоль
                console.log("--- Сырые данные CSV ---");
                console.log(csvText);

                // Дополнительно: Можно преобразовать CSV в массив объектов
                const lines = csvText.trim().split('\n');
                const headers = lines[0].split(',');
                
                const dataArray = lines.slice(1).map(line => {
                    const values = line.split(',');
                    let obj = {};
                    headers.forEach((header, i) => {
                        // Очистка от лишних кавычек и пробелов
                        obj[header.trim().replace(/"/g, '')] = values[i] ? values[i].trim().replace(/"/g, '') : '';
                    });
                    return obj;
                });

                console.log("\n--- Данные в виде массива объектов ---");
                console.table(dataArray); // Вывод данных в удобном табличном виде
                
            } catch (error) {
                console.error("Не удалось получить данные:", error);
            }
        }

        // Запускаем функцию при загрузке страницы
        fetchSheetData();
    </script>
</body>
</html>
