<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный Плейлист</title>
    <style>
        body { font-family: sans-serif; background-color: #181818; color: white; padding: 20px; }
        h1 { text-align: center; color: #ff0000; }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .video-card { background: #282828; border-radius: 12px; padding: 10px; }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
        }
        /* Стили для контейнера API */
        .video-container div {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
    </style>
</head>
<body>

<h1>YouTube Галерея (Играет только один)</h1>

<div class="video-grid">
    <div class="video-card"><div class="video-container"><div id="player1"></div></div></div>
    <div class="video-card"><div class="video-container"><div id="player2"></div></div></div>
    <div class="video-card"><div class="video-container"><div id="player3"></div></div></div>
    <div class="video-card"><div class="video-container"><div id="player4"></div></div></div>
    <div class="video-card"><div class="video-container"><div id="player5"></div></div></div>
    <div class="video-card"><div class="video-container"><div id="player6"></div></div></div>
    <div class="video-card"><div class="video-container"><div id="player7"></div></div></div>
    <div class="video-card"><div class="video-container"><div id="player8"></div></div></div>
</div>

<script>
    // 1. Загружаем API YouTube
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var players = [];

    // 2. Список ваших видео с ID и временем старта
    const videoList = [
        { id: 'player1', videoId: 'oZKO22Y1c88', start: 53 },
        { id: 'player2', videoId: '5LQ9IUyjg3c', start: 67 },
        { id: 'player3', videoId: 'p2RsV7aSBhg', start: 90 },
        { id: 'player4', videoId: 'CSDeedyjBeA', start: 68 },
        { id: 'player5', videoId: 'TIJUEoKYS3E', start: 55 },
        { id: 'player6', videoId: 'DicV5OuivIs', start: 0 },
        { id: 'player7', videoId: 'AKVPhEHqf_U', start: 0 },
        { id: 'player8', videoId: 'mv1GVLR4MI8', start: 0 }
    ];

    // 3. Создаем плееры после загрузки API
    function onYouTubeIframeAPIReady() {
        videoList.forEach(function(item) {
            var player = new YT.Player(item.id, {
                videoId: item.videoId,
                playerVars: { 'start': item.start, 'rel': 0 },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
            players.push(player);
        });
    }

    // 4. Главная функция: если одно видео заиграло, стопаем остальные
    function onPlayerStateChange(event) {
        if (event.data == YT.PlayerState.PLAYING) {
            players.forEach(function(p) {
                // Если это не тот плеер, который только что запустили, и он играет — ставим на паузу
                if (p !== event.target && p.getPlayerState() == YT.PlayerState.PLAYING) {
                    p.pauseVideo();
                }
            });
        }
    }
</script>

</body>
</html>
