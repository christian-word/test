<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Голосовой переводчик (исправленный)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:sans-serif;background:#0d1117;color:#c9d1d9;height:100vh;display:flex;flex-direction:column}
    #input, #output{
        flex:1;padding:5vw;font-size:7.5vw;line-height:1.4;overflow-y:auto;
        white-space:pre-wrap;word-break:break-word;background:#161b22;border:1px solid #30363d;
    }
    #output{background:#21262d;color:#7cffa0;}
    #controls{
        padding:3vw;display:flex;gap:4vw;justify-content:center;align-items:center;
        background:#161b22;border-top:1px solid #30363d;
    }
    button{
        width:70vw;max-width:320px;height:70vw;max-height:130px;
        border-radius:50vw;border:none;font-size:12vw;color:white;
        box-shadow:0 10px 30px rgba(0,0,0,0.6);cursor:pointer;transition:background 0.2s;
    }
    #micFrom{background:#ff3b30;}
    #micFrom.active{background:#ff9500;}
    #micTo{background:#28a745;}
    #micTo.active{background:#00d26a;}
    #swap{font-size:9vw;background:#333;width:60vw;height:60vw;max-width:100px;max-height:100px;}
    #swap:hover{background:#555;}
    #status{text-align:center;padding:2vh;font-size:5vw;color:#58a6ff;}
    @media(min-width:600px){
        #input,#output{font-size:40px}
        button{width:300px;height:110px;font-size:60px;border-radius:60px}
        #swap{width:90px;height:90px;font-size:50px}
    }
</style>
</head>
<body>

<div id="input" aria-live="polite">Нажмите красный микрофон и говорите</div>
<div id="output">Перевод появится здесь</div>

<div id="controls">
    <button id="micFrom" title="Говорите на исходном языке">🎤 RU</button>
    <button id="swap" title="Сменить направление">↔</button>
    <button id="micTo" title="Говорите на целевом языке">🎤 EN</button>
</div>
<div id="status">Готов. Дайте разрешение на микрофон при первом клике.</div>

<script>
if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
    document.getElementById('status').textContent = 'Ваш браузер не поддерживает распознавание речи. Используйте Chrome/Edge.';
    document.querySelectorAll('button').forEach(b => b.disabled = true);
}

// Языки
const langs = {
    ru: 'ru-RU', en: 'en-US', uk: 'uk-UA', es: 'es-ES',
    de: 'de-DE', fr: 'fr-FR', it: 'it-IT', pl: 'pl-PL',
    tr: 'tr-TR', pt: 'pt-PT', ja: 'ja-JP', ko: 'ko-KR',
    zh: 'zh-CN', ar: 'ar-SA', hi: 'hi-IN'
};

let fromLang = 'ru';
let toLang = 'en';
let listeningFrom = false;
let listeningTo = false;

const recFrom = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
const recTo = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

recFrom.continuous = recTo.continuous = true;
recFrom.interimResults = recTo.interimResults = true;
recFrom.lang = langs[fromLang];
recTo.lang = langs[toLang];

const input = document.getElementById('input');
const output = document.getElementById('output');
const micFrom = document.getElementById('micFrom');
const micTo = document.getElementById('micTo');
const swap = document.getElementById('swap');
const status = document.getElementById('status');

function updateButtons() {
    micFrom.textContent = `🎤 ${fromLang.toUpperCase()}`;
    micTo.textContent = `🎤 ${toLang.toUpperCase()}`;
}

// Простой перевод через Google API (работает без ключей)
async function translate(text, targetLangCode) {
    if (!text.trim()) return '';
    try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLangCode}&dt=t&q=${encodeURIComponent(text)}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error('Network error');
        const data = await response.json();
        return data[0].map(([trans]) => trans).join('');
    } catch (error) {
        console.error('Translate error:', error);
        return 'Ошибка перевода. Проверьте интернет.';
    }
}

// Обработчик результата для from
recFrom.onresult = async (e) => {
    let text = '';
    for (let i = e.resultIndex; i < e.results.length; ++i) {
        text += e.results[i][0].transcript;
    }
    input.textContent = text;
    if (e.results[e.results.length - 1].isFinal && text.trim()) {
        status.textContent = 'Перевожу...';
        const translated = await translate(text, toLang);
        output.textContent = translated;
        status.textContent = 'Готов';
    }
};

// Обработчик для to (обратный перевод)
recTo.onresult = async (e) => {
    let text = '';
    for (let i = e.resultIndex; i < e.results.length; ++i) {
        text += e.results[i][0].transcript;
    }
    output.textContent = text;
    if (e.results[e.results.length - 1].isFinal && text.trim()) {
        status.textContent = 'Перевожу...';
        const translated = await translate(text, fromLang);
        input.textContent = translated;
        status.textContent = 'Готов';
    }
};

recFrom.onstart = () => {
    listeningFrom = true;
    micFrom.classList.add('active');
    status.textContent = `Слушаю ${fromLang.toUpperCase()}...`;
};
recFrom.onend = () => {
    listeningFrom = false;
    micFrom.classList.remove('active');
    if (!listeningTo) status.textContent = 'Готов';
};
recFrom.onerror = (e) => {
    console.error('RecFrom error:', e.error);
    status.textContent = `Ошибка: ${e.error}. Попробуйте снова.`;
    recFrom.stop();
};

recTo.onstart = () => {
    listeningTo = true;
    micTo.classList.add('active');
    status.textContent = `Слушаю ${toLang.toUpperCase()}...`;
};
recTo.onend = () => {
    listeningTo = false;
    micTo.classList.remove('active');
    if (!listeningFrom) status.textContent = 'Готов';
};
recTo.onerror = (e) => {
    console.error('RecTo error:', e.error);
    status.textContent = `Ошибка: ${e.error}. Попробуйте снова.`;
    recTo.stop();
};

// Клик по micFrom
micFrom.addEventListener('click', () => {
    if (listeningFrom) {
        recFrom.stop();
    } else {
        // Остановить другой, если работает
        if (listeningTo) recTo.stop();
        recFrom.start();
    }
});

// Клик по micTo
micTo.addEventListener('click', () => {
    if (listeningTo) {
        recTo.stop();
    } else {
        // Остановить другой
        if (listeningFrom) recFrom.stop();
        recTo.start();
    }
});

// Смена направления
swap.addEventListener('click', () => {
    [fromLang, toLang] = [toLang, fromLang];
    recFrom.lang = langs[fromLang];
    recTo.lang = langs[toLang];
    updateButtons();
    status.textContent = `${fromLang.toUpperCase()} → ${toLang.toUpperCase()}`;
    setTimeout(() => {
        if (!listeningFrom && !listeningTo) status.textContent = 'Готов';
    }, 1500);
});

// Инициализация
updateButtons();
status.textContent = `${fromLang.toUpperCase()} → ${toLang.toUpperCase()}. Нажмите микрофон.`;

// Вибрация для мобильных (опционально)
function vibrate(duration = 50) {
    if ('vibrate' in navigator) navigator.vibrate(duration);
}
micFrom.addEventListener('click', () => vibrate(100));
micTo.addEventListener('click', () => vibrate(100));
swap.addEventListener('click', () => vibrate(50));
</script>
</body>
</html>
