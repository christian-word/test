<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Говори — я покажу текст</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      height: 100vh;
      background: #000;
      color: #fff;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #text {
      font-size: 11vw;
      font-weight: 900;
      line-height: 1.15;
      padding: 10vh 6vw;
      text-align: center;
      word-wrap: break-word;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #mic {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 90px;
      background: #0f0;
      border: none;
      border-radius: 50%;
      font-size: 44px;
      box-shadow: 0 8px 30px rgba(0,255,0,0.5);
      z-index: 10;
      cursor: pointer;
    }
    #mic.recording {
      background: #f00;
      animation: pulse 1.2s infinite;
      box-shadow: 0 8px 40px rgba(255,0,0,0.6);
    }
    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 10px 25px;
      border-radius: 30px;
      font-size: 5vw;
      font-weight: bold;
      z-index: 11;
    }
    @keyframes pulse {
      0% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.15); }
      100% { transform: translateX(-50%) scale(1); }
    }
  </style>
</head>
<body>

  <div id="text">Нажми микрофон и говори</div>
  <div id="status">Готов</div>
  <button id="mic">🎤</button>

<script>
  const textDiv = document.getElementById('text');
  const statusDiv = document.getElementById('status');
  const micBtn = document.getElementById('mic');

  let recognition = null;
  let isRecording = false;

  // Универсальная инициализация (работает и SpeechRecognition, и webkitSpeechRecognition)
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'ru-RU';
    recognition.interimResults = true;
    recognition.continuous = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      statusDiv.textContent = 'Слушаю…';
      micBtn.classList.add('recording');
    };

    recognition.onresult = (event) => {
      let interim = '';
      let final = '';

      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          final += transcript + ' ';
        } else {
          interim += transcript;
        }
      }

      const currentText = textDiv.innerText.replace(/▏.*$/g, ''); // убираем старый промежуточный
      textDiv.innerHTML = currentText + final + (interim ? ' <span style="color:#aaa;">' + interim + '▏</span>' : '');
    };

    recognition.onerror = (e) => {
      statusDiv.textContent = 'Ошибка: ' + e.error;
      stopRecording();
      if (e.error === 'not-allowed') {
        textDiv.innerHTML = 'Микрофон запрещён.<br>Разреши доступ в настройках браузера';
      }
    };

    recognition.onend = () => {
      micBtn.classList.remove('recording');
      if (isRecording) recognition.start(); // автоперезапуск
    };
  }

  micBtn.addEventListener('click', toggleRecording);

  function toggleRecording() {
    if (!recognition) {
      textDiv.innerHTML = 'Браузер не поддерживает распознавание речи<br>или страница открыта не по HTTPS';
      return;
    }

    if (isRecording) {
      stopRecording();
    } else {
      startRecording();
    }
  }

  function startRecording() {
    isRecording = true;
    textDiv.innerHTML = '';
    recognition.start();
  }

  function stopRecording() {
    isRecording = false;
    statusDiv.textContent = 'Готов';
    recognition.stop();
  }

  // Долгое нажатие = очистить экран
  let timer;
  const clearScreen = () => {
    textDiv.innerHTML = 'Экран очищен';
    setTimeout(() => { if (!isRecording) textDiv.innerHTML = 'Нажми микрофон и говори'; }, 1500);
  };
  micBtn.addEventListener('touchstart', e => { e.preventDefault(); timer = setTimeout(clearScreen, 2000); });
  micBtn.addEventListener('touchend', e => { e.preventDefault(); clearTimeout(timer); });
  micBtn.addEventListener('mousedown', () => timer = setTimeout(clearScreen, 2000));
  micBtn.addEventListener('mouseup', () => clearTimeout(timer));
</script>
</body>
</html>
