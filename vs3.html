<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Голос → Текст</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
    body{display:flex;flex-direction:column}

    #output{
        flex:1;
        padding:5vw;
        font-size:8vw;
        line-height:1.35;
        overflow-y:auto;
        white-space:pre-wrap;
        word-break:break-word;
    }

    #controls{
        padding:4vw;
        background:rgba(255,255,255,0.05);
        text-align:center;
    }

    #micBtn{
        width:72vw;
        max-width:300px;
        height:72vw;
        max-height:120px;
        border-radius:50vw;
        border:none;
        font-size:14vw;
        background:#d32f2f;
        color:white;
        box-shadow:0 8px 30px rgba(211,47,47,0.5);
    }
    #micBtn.listening{
        background:#4caf50;
        box-shadow:0 8px 40px rgba(76,175,80,0.6);
    }

    #status{
        margin-top:8px;
        font-size:5vw;
        color:#aaa;
    }

    @media(min-width:500px){
        #output{font-size:42px}
        #micBtn{width:280px;height:100px;font-size:70px;border-radius:60px}
        #status{font-size:28px}
    }
</style>
</head>
<body>

<div id="output" aria-live="polite"></div>

<div id="controls">
    <button id="micBtn">Микрофон</button>
    <div id="status">Нажмите и говорите</div>
</div>

<script>
if(!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)){
    document.body.innerHTML='<div style="padding:40px;font-size:48px;text-align:center;color:#fff">Браузер не поддерживает речь<br>Нужен Chrome / Edge</div>';
    throw '';
}

const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
rec.lang = 'ru-RU';
rec.continuous = true;
rec.interimResults = true;

let listening = false;
let final = '';

const btn = document.getElementById('micBtn');
const out = document.getElementById('output');
const stat = document.getElementById('status');

function vibrate(p){ if('vibrate' in navigator) navigator.vibrate(p); }

rec.onstart = ()=>{
    listening=true;
    btn.classList.add('listening');
    btn.textContent='Стоп';
    stat.textContent='СЛУШАЮ…';
    vibrate([100,50,100]);
};
rec.onend = ()=>{
    listening=false;
    btn.classList.remove('listening');
    btn.textContent='Микрофон';
    stat.textContent='Нажмите и говорите';
};
rec.onresult = e=>{
    let interim='';
    final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
        const t = e.results[i][0].transcript;
        e.results[i].isFinal ? final+=t+' ' : interim+=t;
    }
    out.textContent = final+interim;
    out.scrollTop = out.scrollHeight;
};
rec.onerror = ()=>{ stat.textContent='Ошибка, нажмите ещё раз'; rec.stop(); };

btn.onclick = ()=>{
    if(listening) rec.stop();
    else{
        final=''; out.textContent='';
        rec.start();
    }
};
</script>
</body>
</html>
