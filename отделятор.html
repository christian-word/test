<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Audio Extractor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #0056b3; }
        #widget-container { margin-top: 20px; min-height: 150px; width: 100%; }
        iframe { width: 100%; border: none; border-radius: 8px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h3>YouTube Audio Downloader</h3>
    <input type="text" id="videoUrl" placeholder="Вставьте ссылку на YouTube">
    <button onclick="loadWidget()">Сгенерировать кнопку</button>
    
    <div id="widget-container">
        <iframe id="dl-button" height="150px"></iframe>
    </div>
</div>

<script>
function loadWidget() {
    const urlInput = document.getElementById('videoUrl').value;
    const videoIdMatch = urlInput.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    
    if (videoIdMatch && videoIdMatch[1]) {
        const videoId = videoIdMatch[1];
        const iframe = document.getElementById('dl-button');
        
        // Используем виджет от vevioz (на данный момент он стабильно разрешает iframe)
        iframe.src = `https://api.vevioz.com/@api/button/mp3/${videoId}`;
        iframe.style.display = "block";
    } else {
        alert("Пожалуйста, введите корректную ссылку на видео YouTube");
    }
}
</script>

</body>
</html>
