<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Аудио Загрузчик</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; background: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 300px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #ff0000; color: white; border: none; border-radius: 5px; cursor: pointer; margin-left: 5px; }
        #downloader-frame { margin-top: 20px; width: 100%; height: 100px; border: none; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Скачать аудио с YouTube</h2>
    <input type="text" id="videoUrl" placeholder="Вставьте ссылку на видео (https://...)">
    <button onclick="generateDownload()">ОК</button>
    
    <iframe id="downloader-frame" src=""></iframe>
</div>

<script>
function generateDownload() {
    const url = document.getElementById('videoUrl').value;
    // Извлекаем ID видео из ссылки
    const videoId = url.split('v=')[1]?.split('&')[0] || url.split('/').pop();
    
    if (videoId) {
        const frame = document.getElementById('downloader-frame');
        // Используем один из стабильных виджетов (например, от loader.to или vevioz)
        frame.src = `https://loader.to/api/button/?url=https://www.youtube.com/watch?v=${videoId}&f=mp3`;
        frame.style.display = "block";
    } else {
        alert("Пожалуйста, введите корректную ссылку");
    }
}
</script>

</body>
</html>
